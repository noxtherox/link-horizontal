/* ---- weld selection on the part screen: feeds "Add to report" directly, no +VT/+PT pills ---- */
function getPartSelection(partId){
  if(!state.partSelection || state.partSelection.partId!==partId){
    state.partSelection = {partId, ids:new Set()};
  }
  return state.partSelection.ids;
}
const PartActions = {
  toggleWeldSelect(partId, weldId){
    const ids = getPartSelection(partId);
    if(ids.has(weldId)) ids.delete(weldId); else ids.add(weldId);
    render();
  },
  toggleSelectAll(partId){
    const part = findPart(partId);
    const ids = getPartSelection(partId);
    if(ids.size===part.welds.length) ids.clear();
    else part.welds.forEach(w=>ids.add(w.id));
    render();
  },
  addToReportFromPart(partId){
    const part = findPart(partId);
    const ids = Array.from(getPartSelection(partId));
    if(ids.length===0){ toast('Select at least one weld first'); return; }
    AddToReport.open({assemblyId:part.assemblyId, partId, weldIds:ids});
  },
};
function partSelectionBarHtml(part){
  const ids = getPartSelection(part.id);
  const total = part.welds.length;
  const allSelected = total>0 && ids.size===total;
  return '<div class="hstack" style="justify-content:space-between;padding:2px 4px 8px;">'+
    '<label class="hstack" style="gap:10px;cursor:pointer;">'+
      '<input type="checkbox" class="weld-check" '+(allSelected?'checked':'')+' onclick="PartActions.toggleSelectAll(\''+part.id+'\')"/>'+
      '<span style="font-weight:500;font-size:14px;">Select all</span>'+
    '</label>'+
    '<span class="muted" style="font-size:13px;">'+ids.size+' of '+total+' selected</span>'+
  '</div>';
}
function partWeldRowHtml(part, w){
  const meta = w.type+' · '+w.process+' · '+w.position;
  const reqText = (w.inspections||[]).map(i=>i.method).join(' + ') || '—';
  const badge = part.blocked ? weldProgressBadge(w) : weldStatusBadge(w);
  const selected = !part.blocked && getPartSelection(part.id).has(w.id);
  return '<div class="list-row" onclick="App.nav(\'weld\',{weldId:\''+w.id+'\'})">'+
    (part.blocked ? '' : '<input type="checkbox" class="weld-check" '+(selected?'checked':'')+' onclick="event.stopPropagation();PartActions.toggleWeldSelect(\''+part.id+'\',\''+w.id+'\')" aria-label="Select '+w.id+'"/>')+
    '<div class="weld-id">'+w.id+'</div>'+
    '<div class="row-meta"><div>'+meta+'</div><div class="top"><span class="chip" style="pointer-events:none;">Requires '+esc(reqText)+'</span></div></div>'+
    '<div class="stack" style="gap:6px;align-items:flex-end;">'+badge+'</div>'+
    '<span class="chevron">'+ICON.chevron+'</span>'+
  '</div>';
}

SCREENS.part = {
  topbar(params){
    const part = findPart(params.partId);
    return topbarBase({title:part.id+' · '+part.name, subHtml:weldBreadcrumbHtml(part), variant:'assembly'});
  },
  render(params){
    const part = findPart(params.partId);
    const sum = partSummary(part);
    let banner = '';
    if(part.blocked) banner = '<div class="banner banner-info">'+ICON.alert.replace('<svg','<svg style="width:18px;height:18px;flex:0 0 auto;"')+'<span>'+esc(sum.text)+'. You can open a weld to look, but inspection is unavailable until welding is complete.</span></div>';
    else if(sum.repair) banner = '<div class="banner banner-warning">'+ICON.alert.replace('<svg','<svg style="width:18px;height:18px;flex:0 0 auto;"')+'<span>'+sum.repair+' weld returned for repair — this part cannot complete until it is re-tested and accepted.</span></div>';
    const selectionBar = part.blocked ? '' : partSelectionBarHtml(part);
    const rows = part.welds.map(w=>partWeldRowHtml(part, w)).join('');
    return banner + selectionBar + '<div class="stack" style="gap:10px;">'+rows+'</div>';
  },
  footer(params){
    const part = findPart(params.partId);
    if(part.blocked) return '<span class="hint">Inspection unavailable — weld not yet complete.</span>';
    const n = getPartSelection(part.id).size;
    return '<span class="hint">'+(n===0?'Select welds to add to a report.':n+' weld'+(n===1?'':'s')+' selected')+'</span>'+
      '<button class="btn btn-primary btn-lg" '+(n===0?'disabled':'')+' onclick="PartActions.addToReportFromPart(\''+part.id+'\')">Add to report</button>';
  },
};
</script>
<script>
/* ============================= WELD DETAIL — reference view (change 6) ============================= */
/* The weld screen no longer records a verdict — that moved onto the report's weld row
   (change 5). This screen exists so an inspector can understand the weld before, or instead
   of, recording anything: progress, identity, traceability, geometry, who welded it, and the
   weld sessions vs WPS. Modelled on Assembly's weld page, simplified for a tablet. */
function queueOrToast(msg){
  if(state.offline){ state.queued++; toast(msg+' — queued, will sync when connected'); }
  else toast(msg);
}

const WELD_STAGE_LABEL = {Waiting:'Started', Fitting:'Fitting', Welding:'Welding', 'PWHT Completing':'PWHT Completing', Testing:'Testing', Finishing:'Finishing', Shipping:'Shipping'};
function weldStepperHtml(w){
  const seq = STAGES.filter(s=> s!=='PWHT Completing' || w.pwhtRequired);
  const currentIdx = Math.max(0, seq.indexOf(w.stage||'Waiting'));
  const steps = seq.map((s,i)=>{
    const st = i<currentIdx ? 'done' : i===currentIdx ? 'active' : 'todo';
    const color = st==='todo' ? 'var(--border-strong)' : STAGE_COLOR[s];
    return '<div style="flex:1;text-align:center;min-width:0;">'+
      '<div style="height:6px;border-radius:3px;background:'+color+';margin-bottom:6px;"></div>'+
      '<div style="font-size:10px;font-weight:'+(st==='active'?'700':'500')+';text-transform:uppercase;letter-spacing:.03em;color:'+(st==='todo'?'var(--text-muted)':'var(--text)')+';">'+WELD_STAGE_LABEL[s]+'</div>'+
    '</div>';
  }).join('');
  return '<div class="card"><div class="hstack" style="gap:6px;align-items:flex-start;">'+steps+'</div></div>';
}

/* plausible, derived per-weld detail fields — this prototype has no real drawing/traceability
   database behind it, so these are computed deterministically from the weld itself */
const WELD_TYPE_LABEL = {BW:'GW - Groove Weld', FW:'FW - Fillet Weld'};
const PROCESS_LABEL = {'135':'135 – MAG solid wire (GMAW)', '136':'136 – MAG flux cored (FCAW)'};
const PROCESS_FILLER = {'135':'OK Aristorod 12.50 Ø1.2 mm', '136':'OK Tubrod 14.03 Ø1.2 mm'};
const FITTERS = {'ASM-2026-0412':{name:'Marcus Iversen', stamp:'MI2'}, 'ASM-2026-0455':{name:'Elin Torres', stamp:'ET7'}};
const TACK_WELDERS = {'ASM-2026-0412':{name:'Otto Berg', stamp:'OB5'}, 'ASM-2026-0455':{name:'Priya Nandy', stamp:'PN3'}};
function weldDetailInfo(part, w){
  const idx = part.welds.findIndex(x=>x.id===w.id);
  return {
    partNumber: w.id.replace('W-','WP-'),
    weldType: WELD_TYPE_LABEL[w.type] || w.type,
    baseMaterial1: WPS.material,
    baseMaterial2: WPS.material,
    length: (180+idx*15)+' mm',
    isoDrawing: 'ISO-DRW-'+part.id+' Rev.2',
    wpsWithRevision: WPS.id+' (Rev. 0)',
  };
}
function weldTraceabilityHtml(part, w){
  const idx = part.welds.findIndex(x=>x.id===w.id);
  const emptyOr = v=> (v==null||v==='') ? '<span class="muted">—</span>' : esc(v);
  const rows = [
    ['Base material heat number', 'H'+(70000+idx*37)],
    ['PWHT', w.pwhtRequired ? 'Completed — 620 °C / 60 min' : null],
    ['Filler metal lot number · '+(PROCESS_LABEL[w.process]||w.process), 'FL-'+(2400+idx*3)],
    ['Flux lot number', null], // no SAW process on this weld — Assembly renders "—" the same way
  ];
  return '<div class="card collapsible">'+
    '<div class="head'+(w.detailSectionsOpen.traceability?'':' closed')+'" onclick="WeldDetail.toggleSection(\''+w.id+'\',\'traceability\')"><h3>Traceability</h3>'+ICON.chevronDown+'</div>'+
    (w.detailSectionsOpen.traceability ? '<div class="body">'+
      rows.map(([label,val])=>'<div class="param-row"><div class="param-name">'+label+'</div><div>'+emptyOr(val)+'</div></div>').join('')+
    '</div>' : '')+
  '</div>';
}
function grooveDesignHtml(w){
  return '<div class="card collapsible">'+
    '<div class="head'+(w.detailSectionsOpen.groove?'':' closed')+'" onclick="WeldDetail.toggleSection(\''+w.id+'\',\'groove\')"><h3>Groove design &amp; weld layers</h3>'+ICON.chevronDown+'</div>'+
    (w.detailSectionsOpen.groove ? '<div class="body"><div class="grid2">'+
      ['Groove design','Weld layer configuration'].map(label=>
        '<div style="text-align:center;padding:28px 12px;border:1.5px dashed var(--border-strong);border-radius:12px;">'+
          '<div style="color:var(--text-muted);margin-bottom:8px;">'+ICON.noValue.replace('<svg','<svg style="width:22px;height:22px;"')+'</div>'+
          '<div class="muted" style="font-size:13px;">'+label+' — no data to display</div>'+
        '</div>'
      ).join('')+
    '</div></div>' : '')+
  '</div>';
}
function whoDidTheWorkHtml(part, w){
  const asm = assemblyFor(part);
  const idx = part.welds.findIndex(x=>x.id===w.id);
  const date = '2026-09-0'+((idx%6)+1);
  const fitter = FITTERS[asm.id], tack = TACK_WELDERS[asm.id];
  const rows = [
    ['Fitter', fitter.name+' ('+fitter.stamp+')'],
    ['Tack welder', tack.name+' ('+tack.stamp+')'],
    [(PROCESS_LABEL[w.process]||w.process), asm.welder.name+' ('+asm.welder.stamp+') · '+date],
  ];
  return '<div class="card"><div class="section-title">Who did the work</div>'+
    rows.map(([label,val])=>'<div class="param-row"><div class="param-name">'+esc(label)+'</div><div>'+esc(val)+'</div></div>').join('')+
  '</div>';
}

/* ---- weld sessions vs WPS: filterable, with the traffic-light legend on screen ---- */
function weldSessionsSectionHtml(w){
  const all = w.sessions||[];
  if(!all.length){
    return '<div class="card"><div class="section-title">Weld sessions</div><div class="muted">No weld sessions recorded for this weld yet.</div></div>';
  }
  const f = state.weldSessionFilters;
  const paramOptions = Array.from(new Set(all.map(s=>s.wpsParamId)));
  const filtered = all.filter(s=>{
    if(f.excludeTack && s.tack) return false;
    if(f.quality!=='all' && sessionTrafficLight(s)!==f.quality) return false;
    if(f.wpsParam!=='all' && s.wpsParamId!==f.wpsParam) return false;
    return true;
  });
  const legend = ['red','amber','green','grey','teal'].map(k=>
    '<div class="item"><span class="sw" style="background:'+TRAFFIC_LIGHT_COLOR[k]+';border-radius:50%;"></span>'+esc(TRAFFIC_LIGHT_LABEL[k])+'</div>'
  ).join('');
  const qualityChips = ['all','red','amber','green','grey','teal'].map(k=>
    '<button class="filter-chip'+(f.quality===k?' on':'')+'" onclick="WeldDetail.setSessionFilter(\'quality\',\''+k+'\')">'+(k==='all'?'All qualities':k.charAt(0).toUpperCase()+k.slice(1))+'</button>'
  ).join('');
  const paramChips = ['all'].concat(paramOptions).map(k=>
    '<button class="filter-chip'+(f.wpsParam===k?' on':'')+'" onclick="WeldDetail.setSessionFilter(\'wpsParam\','+esc(JSON.stringify(k))+')">'+(k==='all'?'All parameter IDs':esc(k))+'</button>'
  ).join('');
  const rows = filtered.map(s=>{
    const light = sessionTrafficLight(s);
    return '<div class="list-row" onclick="App.nav(\'weldSession\',{weldId:\''+w.id+'\',sessionId:\''+s.id+'\'})">'+
      '<span class="dot-ind" style="background:'+TRAFFIC_LIGHT_COLOR[light]+';width:14px;height:14px;"></span>'+
      '<div style="flex:1;min-width:0;">'+
        '<div class="hstack" style="gap:8px;flex-wrap:wrap;">'+
          '<span style="font-weight:700;font-size:15px;">'+esc(s.pass)+'</span>'+
          '<span class="muted" style="font-size:12px;">'+esc(s.wpsParamId)+'</span>'+
        '</div>'+
        '<div class="muted" style="font-size:13px;">'+esc(s.timestamp)+' · '+esc(s.operator)+((s.events&&s.events.length)?' · <span style="color:var(--warning);">1 event</span>':'')+'</div>'+
      '</div>'+
      '<div class="muted" style="font-size:13px;text-align:right;margin-right:4px;white-space:nowrap;">'+s.current+' A · '+s.voltage+' V</div>'+
      '<span class="chevron">'+ICON.chevron+'</span>'+
    '</div>';
  }).join('');
  return '<div class="card">'+
    '<div class="hstack" style="justify-content:space-between;flex-wrap:wrap;gap:8px;">'+
      '<div class="section-title" style="margin:0;">Weld sessions ('+filtered.length+' of '+all.length+')</div>'+
      '<label class="hstack" style="gap:8px;font-size:13px;cursor:pointer;"><input type="checkbox" '+(f.excludeTack?'checked':'')+' onclick="WeldDetail.toggleExcludeTack()"/>Exclude tack welds</label>'+
    '</div>'+
    '<div class="filter-row" style="margin-top:10px;">'+qualityChips+'</div>'+
    '<div class="filter-row" style="margin-top:8px;">'+paramChips+'</div>'+
    '<div class="stage-legend" style="margin-top:12px;">'+legend+'</div>'+
    '<div class="muted" style="font-size:12px;margin:10px 0 4px;">Each session is judged individually against its own WPS Parameter ID — sessions are never averaged together.</div>'+
    '<div class="stack" style="gap:10px;margin-top:8px;">'+(rows||'<div class="muted" style="padding:16px;text-align:center;">No sessions match these filters.</div>')+'</div>'+
  '</div>';
}
const WeldDetail = {
  toggleSection(weldId, key){ const {weld:w}=findWeld(weldId); w.detailSectionsOpen[key] = !w.detailSectionsOpen[key]; render(); },
  setSessionFilter(key, val){ state.weldSessionFilters[key] = val; render(); },
  toggleExcludeTack(){ state.weldSessionFilters.excludeTack = !state.weldSessionFilters.excludeTack; render(); },
};

function weldBreadcrumbHtml(part){
  const asm = assemblyFor(part);
  return '<span class="crumb-link" onclick="App.nav(\'assembly\',{assemblyId:\''+asm.id+'\'})">'+esc(asm.name)+'</span>'+
    '<span class="crumb-sep">/</span>'+
    '<span class="crumb-link" onclick="App.nav(\'part\',{partId:\''+part.id+'\'})">'+esc(part.id+' · '+part.name)+'</span>';
}
function weldSessionBreadcrumbHtml(part, weldId){
  return weldBreadcrumbHtml(part)+
    '<span class="crumb-sep">/</span>'+
    '<span class="crumb-link" onclick="App.nav(\'weld\',{weldId:\''+weldId+'\'})">'+esc(weldId)+'</span>';
}

SCREENS.weld = {
  topbar(params){
    const {part} = findWeld(params.weldId);
    return topbarBase({title:params.weldId, subHtml:weldBreadcrumbHtml(part), variant:'assembly'});
  },
  render(params){
    const found = findWeld(params.weldId);
    const {part, weld:w} = found;
    const meta = w.type+' · '+w.process+' · '+w.position;

    if(part.blocked){
      const welder = assemblyFor(part).welder;
      return '<div class="stack">'+
        '<div class="card">'+
          '<div class="hstack" style="justify-content:space-between;">'+
            '<div style="font-weight:700;font-size:18px;">'+w.id+'</div>'+
            weldProgressBadge(w)+
          '</div>'+
          '<div class="muted" style="margin-top:4px;">'+meta+'</div>'+
        '</div>'+
        '<div class="card" style="text-align:center;padding:28px 18px;">'+
          '<div style="color:var(--text-muted);margin-bottom:8px;">'+ICON.lock.replace('<svg','<svg style="width:28px;height:28px;"')+'</div>'+
          '<div style="font-weight:700;">Not yet ready for inspection</div>'+
          '<div class="muted" style="font-size:14px;margin-top:4px;">This weld is still with '+welder.name+' ('+welder.stamp+'). You can look, but you can\'t start an inspection yet.</div>'+
        '</div>'+
      '</div>';
    }

    const info = weldDetailInfo(part, w);
    const inspBadges = (w.inspections||[]).map(insp=>{
      const cls = insp.result==='Acceptable' ? 'badge-success' : insp.result==='Failed' ? 'badge-error' : 'badge-muted';
      const label = insp.method+' · '+(insp.result || (insp.assignedTo ? 'pending' : 'unassigned'));
      return '<span class="badge '+cls+'">'+label+'</span>';
    }).join(' ');

    return '<div class="stack">'+
      '<div class="muted" style="font-size:13px;">'+esc(weldPositionText(part, w.id))+'</div>'+
      weldStepperHtml(w)+
      '<div class="card">'+
        '<div class="hstack" style="justify-content:space-between;flex-wrap:wrap;gap:8px;">'+
          '<div><div style="font-weight:700;font-size:18px;">'+w.id+'</div><div class="muted">'+meta+'</div></div>'+
          '<div class="hstack" style="gap:6px;flex-wrap:wrap;">'+inspBadges+'</div>'+
        '</div>'+
        '<div class="divider"></div>'+
        '<div class="grid2" style="gap:14px;">'+
          '<div><div class="label-sm">Weld ID</div><div class="val-lg">'+w.id+'</div></div>'+
          '<div><div class="label-sm">Weld part number</div><div class="val-lg">'+info.partNumber+'</div></div>'+
          '<div><div class="label-sm">Weld type</div><div class="val-lg">'+esc(info.weldType)+'</div></div>'+
          '<div><div class="label-sm">Base material — part 1</div><div class="val-lg">'+esc(info.baseMaterial1)+'</div></div>'+
          '<div><div class="label-sm">Base material — part 2</div><div class="val-lg">'+esc(info.baseMaterial2)+'</div></div>'+
          '<div><div class="label-sm">Weld length</div><div class="val-lg">'+info.length+'</div></div>'+
          '<div><div class="label-sm">Part</div><div class="val-lg crumb-link" style="cursor:pointer;" onclick="App.nav(\'part\',{partId:\''+part.id+'\'})">'+part.id+' · '+esc(part.name)+'</div></div>'+
          '<div><div class="label-sm">ISO drawing</div><div class="val-lg">'+esc(info.isoDrawing)+'</div></div>'+
          '<div><div class="label-sm">WPS</div><div class="val-lg">'+esc(info.wpsWithRevision)+'</div></div>'+
        '</div>'+
        '<div class="divider"></div>'+
        '<div class="label-sm" style="margin-bottom:8px;">Filler metal per process</div>'+
        '<div class="param-row"><div class="param-name">'+esc(PROCESS_LABEL[w.process]||w.process)+'</div><div>'+esc(PROCESS_FILLER[w.process]||'—')+'</div></div>'+
      '</div>'+
      weldTraceabilityHtml(part, w)+
      grooveDesignHtml(w)+
      whoDidTheWorkHtml(part, w)+
      weldSessionsSectionHtml(w)+
    '</div>';
  },
  footer(params){
    const {part, weld:w} = findWeld(params.weldId);
    if(part.blocked) return '<span class="hint">Inspection unavailable — weld not yet complete.</span>';
    const nid = nextWeldId(part, w.id);
    return '<span class="hint">'+esc(weldPositionText(part, w.id))+'</span>'+
      (nid ? '<button class="btn btn-outline btn-lg" onclick="App.nav(\'weld\',{weldId:\''+nid+'\'})">Next weld '+ICON.chevron.replace('<svg','<svg style="width:16px;height:16px;"')+'</button>' : '<span class="muted" style="font-size:13px;">Last weld on '+part.id+'</span>')+
      '<button class="btn btn-primary btn-lg" onclick="App.back()">Close</button>';
  },
};

/* ============================= WELD SESSION DETAIL ============================= */
function sessionInfoStripCard(part, w, s){
  const fields = [
    ['Operator', s.operator],
    ['WPS', WPS.id],
    ['Work order', 'Not set'],
    ['Assembly', assemblyFor(part).name],
    ['Part', part.id+' · '+part.name],
    ['Weld ID', w.id],
  ];
  return '<div class="card">'+
    '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;">'+
      fields.map(([label,val])=>'<div><div class="label-sm">'+esc(label)+'</div><div class="val-lg" style="font-size:15px;margin-top:2px;">'+esc(val)+'</div></div>').join('')+
    '</div>'+
  '</div>';
}

function sessionValuesCard(s){
  const tiles = [
    {label:'Arc time', val:formatArcTime(s.arcSeconds), unit:''},
    {label:'Wire feed speed', val:s.wfs, unit:'m/min', key:'wfs'},
    {label:'Voltage', val:s.voltage, unit:'V', key:'voltage'},
    {label:'Current', val:s.current, unit:'A', key:'current'},
    {label:'Power', val:s.power, unit:'kW', key:'power'},
    {label:'Fusion rate', val:s.fusionRate, unit:'kg/h'},
  ];
  return '<div class="card">'+
    '<div class="section-title">Values</div>'+
    '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">'+
      tiles.map(t=>{
        const breach = t.key ? rangeStatus(s.chart, t.key).avgBreach : false;
        return '<div style="background:var(--surface-sunken);border:1px solid '+(breach?'var(--error)':'var(--border)')+';border-radius:12px;padding:14px;text-align:center;">'+
          '<div class="label-sm">'+esc(t.label)+'</div>'+
          '<div style="font-size:21px;font-weight:700;margin-top:4px;'+(breach?'color:var(--error);':'')+'">'+t.val+(t.unit?' <span style="font-size:12px;font-weight:500;color:var(--text-muted);">'+t.unit+'</span>':'')+'</div>'+
          (breach ? '<div style="font-size:11px;color:var(--error);margin-top:4px;font-weight:600;">Out of WPS range</div>' : '')+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}

function roundTo(v, decimals){
  const f = Math.pow(10, decimals);
  return Math.round(v*f)/f;
}

function sparkChart(s, key, color, label, unit){
  const chart = s.chart;
  const status = rangeStatus(chart, key);
  const decimals = METRIC_RANGES[key].decimals;
  const [rMin, rMax] = status.range;
  const vals = chart.map(d=>d[key]);
  const dataMax = Math.max.apply(null, vals), dataMin = Math.min.apply(null, vals);
  let domainMin = Math.min(dataMin, rMin), domainMax = Math.max(dataMax, rMax);
  const domPad = (domainMax-domainMin)*0.18 || domainMax*0.1 || 1;
  domainMin -= domPad; domainMax += domPad;
  const W=600, H=70, padX=10, padY=6;
  const stepX = (W-2*padX)/((chart.length-1)||1);
  const scaleY = v => H-padY - ((v-domainMin)/(domainMax-domainMin))*(H-2*padY);
  const pts = vals.map((v,i)=>(padX+i*stepX).toFixed(1)+','+scaleY(v).toFixed(1)).join(' ');
  const lineColor = status.avgBreach ? 'var(--error)' : color;
  const limitLine = v => '<line x1="'+padX+'" y1="'+scaleY(v).toFixed(1)+'" x2="'+(W-padX)+'" y2="'+scaleY(v).toFixed(1)+'" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/>';
  const markers = vals.map((v,i)=> status.pointBreaches[i]
    ? '<circle cx="'+(padX+i*stepX).toFixed(1)+'" cy="'+scaleY(v).toFixed(1)+'" r="4.5" fill="var(--warning)" stroke="var(--surface-card)" stroke-width="1.5"/>'
    : ''
  ).join('');
  const statusNote = status.avgBreach
    ? '<span style="color:var(--error);font-weight:700;">avg '+roundTo(status.avg,decimals)+' '+unit+' — out of WPS range</span>'
    : status.hasPointBreach
      ? '<span style="color:var(--warning);">briefly outside WPS range</span>'
      : '<span class="muted">WPS '+rMin+'–'+rMax+' '+unit+'</span>';
  return '<div style="margin-bottom:14px;">'+
    '<div class="hstack" style="justify-content:space-between;margin-bottom:2px;flex-wrap:wrap;gap:6px;">'+
      '<span class="muted" style="font-size:12px;font-weight:600;">'+esc(label)+'</span>'+
      '<span style="font-size:11px;">'+statusNote+'</span>'+
    '</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:56px;display:block;">'+
      limitLine(rMax)+limitLine(rMin)+
      '<polyline points="'+pts+'" fill="none" stroke="'+lineColor+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
      markers+
    '</svg>'+
  '</div>';
}

function sessionChartCard(s){
  const timeLabels = s.chart.map((d,i)=>'00:0'+i);
  const anyAvgBreach = Object.keys(METRIC_RANGES).some(k=>rangeStatus(s.chart,k).avgBreach);
  return '<div class="card">'+
    '<div class="section-title">Measured values</div>'+
    (anyAvgBreach ? '<div class="banner banner-warning" style="background:rgba(226,57,0,.1);border-color:rgba(226,57,0,.35);color:var(--error);">'+ICON.alert.replace('<svg','<svg style="width:18px;height:18px;flex:0 0 auto;"')+'<span>Average value out of WPS tolerance — this is more significant than a brief excursion and should be reviewed.</span></div>' : '')+
    sparkChart(s,'wfs','#f1a30a','Wire feed speed (m/min)','m/min')+
    sparkChart(s,'current','#6a5acd','Current (A)','A')+
    sparkChart(s,'voltage','#2e7d32','Voltage (V)','V')+
    sparkChart(s,'power','#a52850','Power (kW)','kW')+
    '<div class="hstack" style="justify-content:space-between;font-size:11px;color:var(--text-muted);">'+
      timeLabels.map(t=>'<span>'+t+'</span>').join('')+
    '</div>'+
  '</div>';
}

function sessionEventsCard(events){
  const rows = events.map(e=>
    '<tr><td>'+esc(e.time)+'</td><td>'+esc(e.timestamp)+'</td><td>'+esc(e.category)+'</td>'+
    '<td style="color:var(--error);"><span class="hstack" style="gap:6px;">'+ICON.alert.replace('<svg','<svg style="width:14px;height:14px;flex:0 0 auto;"')+'<span>'+esc(e.message)+'</span></span></td></tr>'
  ).join('');
  return '<div class="card">'+
    '<div class="section-title">Events</div>'+
    '<div class="wrap-table"><table class="ind"><thead><tr><th>Time</th><th>Timestamp</th><th>Category</th><th>Event</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '</div>';
}

SCREENS.weldSession = {
  topbar(params){
    const rec = findSession(params.weldId, params.sessionId);
    return topbarBase({title:rec.session.pass, subHtml:weldSessionBreadcrumbHtml(rec.part, params.weldId), variant:'assembly'});
  },
  render(params){
    const rec = findSession(params.weldId, params.sessionId);
    const {part, weld:w, session:s} = rec;
    return '<div class="stack">'+
      sessionInfoStripCard(part, w, s)+
      sessionValuesCard(s)+
      sessionChartCard(s)+
      (s.events.length ? sessionEventsCard(s.events) : '')+
    '</div>';
  },
};
</script>
<script>
/* ============================= REJECT WIZARD ============================= */
const SIZE_FIELDS = [
  {key:'qty', label:'Quantity', unit:''},
  {key:'width', label:'Width', unit:'mm'},
  {key:'length', label:'Length', unit:'mm'},
  {key:'height', label:'Height', unit:'mm'},
  {key:'depth', label:'Depth', unit:'mm'},
  {key:'angle', label:'Angle', unit:'°'},
];

/* imperfection recording is now fully independent of the result — an observation, not a
   verdict (change 5). The wizard's screens are unchanged; only how it's reached and what
   happens on save are new: it always just adds a chip to the weld row and returns there. */
function newImperfectionDraft(weldId, method, reportId){
  return {weldId, method, reportId, stackDepth: state.stack.length,
    reasonCode:null, reasonLabel:null, qty:null,width:null,length:null,height:null,depth:null,angle:null,
    markers:[], remarks:'', search:'', photoTaken:false};
}

const RejectFlow = {
  startAddImperfection(weldId, method, reportId){
    state.draft = newImperfectionDraft(weldId, method, reportId);
    App.nav('rejectReason');
  },
  setSearch(v){ state.draft.search = v; renderReasonList(); },
  selectReason(code, label){ state.draft.reasonCode = code; state.draft.reasonLabel = label; renderReasonList(); },
  toSize(){ App.nav('rejectSize'); },
  openSizeKeypad(field){
    const f = SIZE_FIELDS.find(f=>f.key===field);
    Keypad.open(f.label, state.draft[field], f.unit, v=>{ state.draft[field]=v; });
  },
  toPhoto(){ App.nav('rejectPhoto'); },
  capturePhoto(){ state.draft.photoTaken = true; render(); },
  retakePhoto(){ state.draft.photoTaken = false; state.draft.markers = []; render(); },
  markPhoto(ev){
    const rect = ev.currentTarget.getBoundingClientRect();
    const x = ((ev.clientX-rect.left)/rect.width*100).toFixed(1);
    const y = ((ev.clientY-rect.top)/rect.height*100).toFixed(1);
    state.draft.markers.push({n:state.draft.markers.length+1, x, y, code:state.draft.reasonCode});
    render();
  },
  removeMarker(n){
    state.draft.markers = state.draft.markers.filter(m=>m.n!==n).map((m,i)=>({...m, n:i+1}));
    render();
  },
  toRemarks(){ App.nav('rejectRemarks'); },
  setRemarks(v){ state.draft.remarks = v; },
  submitImperfection(){
    const d = state.draft;
    const {weld:w} = findWeld(d.weldId);
    const insp = w.inspections.find(i=>i.method===d.method);
    insp.indications.push({n:insp.indications.length+1, code:d.reasonCode, label:d.reasonLabel,
      qty:d.qty,width:d.width,length:d.length,height:d.height,depth:d.depth,angle:d.angle,
      markers:d.markers, remarks:d.remarks, causedRejection: insp.result==='Failed'});
    queueOrToast('Imperfection recorded on '+d.weldId+' ('+d.method+')');
    state.stack = state.stack.slice(0, d.stackDepth);
    state.draft = null;
    render();
  },
};

function renderReasonList(){
  const list = document.getElementById('reasonList');
  if(!list) return;
  const q = (state.draft.search||'').toLowerCase().trim();
  const items = IMPERFECTIONS.filter(i=> i.code.indexOf(q)!==-1 || i.label.toLowerCase().indexOf(q)!==-1);
  list.innerHTML = items.map(i=>{
    const sel = state.draft.reasonCode===i.code;
    return '<div class="reason-row'+(sel?' selected':'')+'" onclick="RejectFlow.selectReason(\''+i.code+'\', '+esc(JSON.stringify(i.label))+')">'+
      '<div class="reason-code">'+i.code+'</div><div style="flex:1;font-size:16px;">'+i.label+'</div>'+
      (sel? '<span style="color:var(--accent-text);">'+ICON.check+'</span>' : '')+
    '</div>';
  }).join('') || '<div class="muted" style="padding:24px;text-align:center;">No matches for "'+esc(q)+'"</div>';
  const nextBtn = document.getElementById('reasonNextBtn');
  if(nextBtn) nextBtn.disabled = !state.draft.reasonCode;
}

SCREENS.rejectReason = {
  topbar(){
    const d = state.draft;
    return topbarBase({title:'Add imperfection', sub:'ISO 6520-1 · '+d.weldId+' · '+d.method, variant:'assembly'});
  },
  render(){
    return '<div class="stack">'+
      '<input class="search-input" placeholder="Search by code or name…" value="'+esc(state.draft.search||'')+'" oninput="RejectFlow.setSearch(this.value)"/>'+
      '<div id="reasonList"></div>'+
    '</div>';
  },
  footer(){
    return '<button class="btn btn-primary btn-lg" id="reasonNextBtn" '+(state.draft.reasonCode?'':'disabled')+' onclick="RejectFlow.toSize()">Next — size imperfection</button>';
  },
  after(){ renderReasonList(); },
};

SCREENS.rejectSize = {
  topbar(){ return topbarBase({title:'Size the imperfection', sub:state.draft.reasonCode+' '+state.draft.reasonLabel, variant:'assembly'}); },
  render(){
    const d = state.draft;
    const fields = SIZE_FIELDS.map(f=>{
      const v = d[f.key];
      return '<div class="field"><label>'+f.label+'</label>'+
        '<div class="keypad-display'+(v==null?' empty':'')+'" onclick="RejectFlow.openSizeKeypad(\''+f.key+'\')">'+
          (v==null?'Tap to enter':v+' '+f.unit)+
          '<span class="unit">'+(v==null?'':'')+'</span>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="stack">'+
      '<div class="card"><div class="grid2" style="gap:16px;">'+fields+'</div></div>'+
    '</div>';
  },
  footer(){
    return '<button class="btn btn-primary btn-lg" '+(state.draft.qty==null?'disabled':'')+' onclick="RejectFlow.toPhoto()">Next — capture photo</button>';
  },
};

SCREENS.rejectPhoto = {
  topbar(){ return topbarBase({title:'Photo & annotation', sub:state.draft.weldId, variant:'assembly'}); },
  render(){
    const d = state.draft;
    if(!d.photoTaken){
      return '<div class="stack">'+
        '<div class="card" style="text-align:center;padding:48px 18px;">'+
          '<div style="color:var(--text-muted);margin-bottom:12px;">'+ICON.camera.replace('<svg','<svg style="width:40px;height:40px;"')+'</div>'+
          '<div style="font-weight:700;font-size:16px;">Capture a photo of the imperfection</div>'+
          '<div class="muted" style="margin-top:6px;">Tablet camera capture is simulated for this prototype.</div>'+
          '<button class="btn btn-primary" style="margin-top:18px;" onclick="RejectFlow.capturePhoto()">Simulate camera capture</button>'+
        '</div>'+
      '</div>';
    }
    const markerRows = d.markers.map(m=>
      '<div class="hstack" style="justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-card);">'+
        '<div class="hstack"><span class="badge badge-error" style="min-width:26px;justify-content:center;">'+m.n+'</span><span style="font-size:15px;">'+m.code+' '+esc(d.reasonLabel)+'</span></div>'+
        '<button class="btn btn-outline" style="min-height:40px;padding:0 10px;" onclick="RejectFlow.removeMarker('+m.n+')">'+ICON.trash.replace('<svg','<svg style="width:16px;height:16px;"')+'</button>'+
      '</div>'
    ).join('');
    return '<div class="stack">'+
      '<div class="card">'+
        weldImageSVG(d.markers, {interactive:true, style:'width:100%;aspect-ratio:400/240;'})+
        '<div class="muted" style="font-size:13px;margin-top:10px;">Tap anywhere on the photo to drop a numbered marker at the defect location. You can add more than one.</div>'+
        '<button class="btn btn-outline" style="margin-top:10px;" onclick="RejectFlow.retakePhoto()">Retake photo</button>'+
      '</div>'+
      '<div class="section-title">Markers ('+d.markers.length+')</div>'+
      '<div class="stack" style="gap:8px;">'+(markerRows||'<div class="muted">No markers yet — tap the photo above.</div>')+'</div>'+
    '</div>';
  },
  footer(){
    const d = state.draft;
    if(!d.photoTaken) return '';
    return '<button class="btn btn-primary btn-lg" '+(d.markers.length===0?'disabled':'')+' onclick="RejectFlow.toRemarks()">Next — add remarks</button>';
  },
};

SCREENS.rejectRemarks = {
  topbar(){
    const d = state.draft;
    return topbarBase({title:'Remarks & save', sub:d.weldId, variant:'assembly'});
  },
  render(){
    const d = state.draft;
    return '<div class="stack">'+
      '<div class="card">'+
        '<div class="section-title">Summary</div>'+
        '<div class="grid2">'+
          '<div><div class="label-sm">Imperfection</div><div class="val-lg">'+d.reasonCode+' '+esc(d.reasonLabel)+'</div></div>'+
          '<div><div class="label-sm">Markers</div><div class="val-lg">'+d.markers.length+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="field"><label>Remarks</label>'+
        '<textarea class="input" rows="5" placeholder="Describe what you observed…" oninput="RejectFlow.setRemarks(this.value)">'+esc(d.remarks||'')+'</textarea>'+
      '</div>'+
    '</div>';
  },
  footer(){
    return '<button class="btn btn-primary btn-lg" onclick="RejectFlow.submitImperfection()">Save imperfection</button>';
  },
};
</script>
<script>
/* ============================= REPORT (every inspection produces one) ============================= */
function demoDateStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function demoTimestampFull(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return demoDateStr()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function formatDateDMY(iso){
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function formField(label, value, opts){
  opts = opts || {};
  return '<div class="field"><label'+(opts.required?' class="req"':'')+'>'+label+'</label>'+
    '<div class="select-display">'+esc(value)+ICON.chevronDown+'</div></div>';
}
/* a field that is a fixed attribute of the report, not something to edit — the inspector's
   identity and the report's test type both lock the moment the report is created */
function lockedField(label, value){
  return '<div class="field"><label>'+label+'</label><div class="select-display" style="opacity:.85;">'+esc(value)+ICON.lock.replace('<svg','<svg style="width:15px;height:15px;color:var(--text-muted);"')+'</div></div>';
}

/* ---- which test methods a weld selection actually requires, filtered to what's not
   already on a report — this drives change 7's "only show what's needed" ---- */
function methodsRequiredByWelds(weldIds){
  const set = [];
  weldIds.forEach(id=>{
    const found = findWeld(id);
    if(!found) return;
    (found.weld.inspections||[]).forEach(i=>{ if(!i.reportId && set.indexOf(i.method)===-1) set.push(i.method); });
  });
  return set;
}
/* the credential gate from change 7 — a method with no matching credential shows disabled,
   with the reason, rather than being hidden */
function testTypePickerHtml(methods, onChooseFnName){
  if(!methods.length){
    return '<h2>New report</h2><p class="muted">The selected welds already have every inspection on a report.</p>'+
      '<div class="modal-actions"><button class="btn btn-outline" onclick="Modal.close()">Close</button></div>';
  }
  const rows = methods.map(m=>{
    const cert = inspectorCertFor(m);
    return cert
      ? '<button class="btn btn-outline btn-block" style="justify-content:space-between;" onclick="'+onChooseFnName+'(\''+m+'\')"><span>'+m+' — '+METHOD_INFO[m].name+'</span></button>'
      : '<button class="btn btn-outline btn-block" style="justify-content:space-between;opacity:.5;cursor:not-allowed;" disabled><span>'+m+' — '+METHOD_INFO[m].name+'</span><span style="font-size:12px;">'+esc(missingCredentialReason(m))+'</span></button>';
  }).join('');
  return '<h2>New report</h2><p class="muted">Only test methods the selected welds actually require are shown.</p>'+
    '<div class="stack" style="gap:8px;">'+rows+'</div>'+
    '<div class="modal-actions"><button class="btn btn-outline" onclick="Modal.close()">Cancel</button></div>';
}
/* ---- "Add to report" — the one entry point that replaces every old "New report" button
   (change 9). Only usable once welds are selected; it never asks the inspector to guess a
   scope up front the way the old flow did. ---- */
const AddToReport = {
  open(scope){
    state.pendingReportScope = scope;
    const methods = methodsRequiredByWelds(scope.weldIds);
    const existing = draftReportsList().filter(r=>r.assemblyId===scope.assemblyId && methods.indexOf(r.method)!==-1);
    Modal.open(
      '<h2>Add to report</h2>'+
      '<p class="muted">'+scope.weldIds.length+' weld'+(scope.weldIds.length===1?'':'s')+' selected.</p>'+
      '<div class="stack" style="gap:8px;">'+
        '<div class="reason-row" style="border-color:var(--accent-text);" onclick="AddToReport.newReport()">'+
          '<div style="flex:1;font-weight:600;color:var(--accent-text);">'+ICON.plus.replace('<svg','<svg style="width:16px;height:16px;"')+' New report</div>'+
        '</div>'+
        (existing.length ? existing.map(r=>
          '<div class="reason-row" onclick="AddToReport.addToExisting(\''+r.id+'\')">'+
            '<div style="flex:1;"><div style="font-weight:600;">'+r.method+' · '+r.id+'</div><div class="muted" style="font-size:13px;">'+r.welds.length+' weld'+(r.welds.length===1?'':'s')+' so far</div></div>'+
          '</div>'
        ).join('') : '<div class="muted" style="font-size:13px;">No matching draft reports yet on this assembly.</div>')+
      '</div>'+
      '<div class="modal-actions"><button class="btn btn-outline" onclick="Modal.close()">Cancel</button></div>'
    );
  },
  newReport(){
    const scope = state.pendingReportScope || {weldIds:[]};
    const methods = methodsRequiredByWelds(scope.weldIds);
    Modal.open(testTypePickerHtml(methods, 'AddToReport.chooseMethod'));
  },
  chooseMethod(method){
    const scope = state.pendingReportScope || {weldIds:[]};
    const r = ReportFlow.createNewChecked(method, scope.assemblyId, scope.partId);
    Modal.close();
    if(!r) return;
    scope.weldIds.forEach(id=>{
      const found = findWeld(id);
      if(found && found.weld.inspections.some(i=>i.method===method && !i.reportId)) addWeldToReport(r.id, id);
    });
    state.partSelection = null;
    App.nav('report', {reportId:r.id});
  },
  addToExisting(reportId){
    const scope = state.pendingReportScope || {weldIds:[]};
    const r = DATA.reports[reportId];
    scope.weldIds.forEach(id=>{
      const found = findWeld(id);
      if(found && found.weld.inspections.some(i=>i.method===r.method && !i.reportId)) addWeldToReport(reportId, id);
    });
    state.partSelection = null;
    Modal.close();
    App.nav('report', {reportId});
  },
};

const ReportFlow = {
  createNewSilent(method, assemblyId, scopePartId){
    const id = 'NDT-2026-'+String(DATA.reportCounter).padStart(4,'0');
    DATA.reportCounter++;
    const report = makeReportBase(id, method, assemblyId, scopePartId, demoDateStr());
    report.title = 'NEW: '+method+' '+id;
    DATA.reports[id] = report;
    return report;
  },
  /* the only gate on creating a new draft report — caps concurrent drafts at 3 */
  createNewChecked(method, assemblyId, scopePartId){
    // reports engineering already prepared don't eat into the inspector's own cap
    const ownDrafts = draftReportsList().filter(r=>!r.preparedByEngineering).length;
    if(ownDrafts>=3){
      toast('You already have 3 draft reports open — sign or complete one before starting another.');
      return null;
    }
    return ReportFlow.createNewSilent(method, assemblyId, scopePartId);
  },
  openReport(id){ App.nav('report', {reportId:id}); },
  toggleSection(reportId, key){ const r=DATA.reports[reportId]; r.sectionsOpen[key] = !r.sectionsOpen[key]; render(); },
  setTestTypeVar(reportId, key, v){ DATA.reports[reportId].testTypeVars[key] = v; },
  openTestTypeVarKeypad(reportId, key, label, unit){
    const r = DATA.reports[reportId];
    Keypad.open(label, r.testTypeVars[key], unit, v=>{ r.testTypeVars[key]=v; render(); });
  },
  addMaterial(reportId){ DATA.reports[reportId].ndtMaterials.push(makeMaterial('', NDT_MATERIAL_TYPES[0], '')); render(); },
  removeMaterial(reportId, idx){ DATA.reports[reportId].ndtMaterials.splice(idx,1); render(); },
  setMaterialField(reportId, idx, field, v){ DATA.reports[reportId].ndtMaterials[idx][field] = v; },
  setNotes(reportId, v){ DATA.reports[reportId].notes = v; },
  setTitle(reportId, v){ DATA.reports[reportId].title = v; },
  togglePdf(reportId){
    const r = DATA.reports[reportId];
    r.pdfAttached = !r.pdfAttached;
    if(r.pdfAttached) toast('PDF attached (simulated)');
    render();
  },
  toggleWeldSelect(weldId){
    if(state.addWeldsSelection.has(weldId)) state.addWeldsSelection.delete(weldId);
    else state.addWeldsSelection.add(weldId);
    render();
  },
  toggleSelectAllEligible(partId, reportId){
    const r = DATA.reports[reportId];
    const part = findPart(partId);
    const eligibleIds = part.welds.filter(w=>{
      const insp = w.inspections.find(i=>i.method===r.method);
      return insp && !insp.reportId;
    }).map(w=>w.id);
    const allSelected = eligibleIds.every(id=>state.addWeldsSelection.has(id));
    eligibleIds.forEach(id=> allSelected ? state.addWeldsSelection.delete(id) : state.addWeldsSelection.add(id));
    render();
  },
  commitAddWelds(reportId){
    const ids = Array.from(state.addWeldsSelection);
    ids.forEach(weldId=>addWeldToReport(reportId, weldId));
    state.addWeldsSelection = new Set();
    queueOrToast(ids.length+' weld'+(ids.length===1?'':'s')+' added to '+reportId);
    App.back();
  },
  /* the only confirmation left in the flow (change 5) — everything else is immediate */
  sign(reportId){
    const r = DATA.reports[reportId];
    const partIds = new Set(r.welds.map(id=>{ const f=findWeld(id); return f?f.part.id:null; }).filter(Boolean));
    const passed = r.welds.filter(id=>{ const {weld:w}=findWeld(id); return w.inspections.find(i=>i.method===r.method).result==='Acceptable'; }).length;
    const failed = r.welds.filter(id=>{ const {weld:w}=findWeld(id); return w.inspections.find(i=>i.method===r.method).result==='Failed'; }).length;
    Modal.open(
      '<h2>Sign &amp; save report</h2>'+
      '<div class="card" style="background:var(--surface-sunken);">'+
        '<div class="grid2">'+
          '<div><div class="label-sm">Report number</div><div class="val-lg">'+r.id+'</div></div>'+
          '<div><div class="label-sm">Test type</div><div class="val-lg">'+r.method+'</div></div>'+
          '<div><div class="label-sm">Parts</div><div class="val-lg">'+partIds.size+'</div></div>'+
          '<div><div class="label-sm">Welds</div><div class="val-lg">'+r.welds.length+'</div></div>'+
          '<div><div class="label-sm">Passed</div><div class="val-lg" style="color:var(--success);">'+passed+'</div></div>'+
          '<div><div class="label-sm">Failed</div><div class="val-lg" style="color:var(--error);">'+failed+'</div></div>'+
        '</div>'+
      '</div>'+
      '<p class="muted" style="font-size:13px;margin-top:12px;">Signed by '+esc(INSPECTOR.name)+' · '+r.method+' Level '+INSPECTOR.level+' · '+esc(inspectorCertFor(r.method)||'')+'.</p>'+
      '<div class="modal-actions"><button class="btn btn-outline" onclick="Modal.close()">Cancel</button><button class="btn btn-success" onclick="ReportFlow.doSign(\''+reportId+'\')">Sign &amp; save</button></div>'
    );
  },
  doSign(reportId){
    const r = DATA.reports[reportId];
    r.status = 'signed';
    r.signedBy = INSPECTOR.name;
    r.signedLevel = INSPECTOR.level;
    r.signedCert = inspectorCertFor(r.method);
    r.signedAt = demoTimestampFull();
    Modal.close();
    queueOrToast(r.id+' signed and saved — sent to WeldCloud Assembly');
    App.home();
  },
};

/* ---- weld row actions — recording a result is immediate and reversible (change 5); no
   per-weld confirmation, no "active report" to resolve since the report is already the
   screen we're on ---- */
const WeldRowActions = {
  setResult(reportId, weldId, result){
    const r = DATA.reports[reportId];
    const {weld:w} = findWeld(weldId);
    const insp = w.inspections.find(i=>i.method===r.method);
    insp.result = result;
    if(result==='Failed'){
      if(!w.ncr) w.ncr = 'NCR-2026-'+String(DATA.ncrCounter++).padStart(4,'0');
      w.status = 'Not acceptable';
      w.disposition = 'awaiting QA';
      w.stage = 'Welding';
      queueOrToast(weldId+' — '+r.method+' Not acceptable, '+w.ncr+' raised');
    } else {
      w.status = w.inspections.every(i=>i.result==='Acceptable') ? 'Acceptable' : 'Pending';
      if(w.status==='Acceptable') w.stage = 'Finishing';
      queueOrToast(weldId+' '+r.method+' recorded — Acceptable');
    }
    render();
  },
  claim(reportId, weldId){
    const r = DATA.reports[reportId];
    const {weld:w} = findWeld(weldId);
    const insp = w.inspections.find(i=>i.method===r.method);
    if(!inspectorCertFor(r.method)) return;
    insp.assignedTo = INSPECTOR.name;
    queueOrToast(r.method+' on '+weldId+' claimed');
    render();
  },
  addPhoto(reportId, weldId){
    const r = DATA.reports[reportId];
    const {weld:w} = findWeld(weldId);
    const insp = w.inspections.find(i=>i.method===r.method);
    insp.photos.push({id:'ph-'+Math.random().toString(36).slice(2)});
    render();
  },
  removePhoto(reportId, weldId, idx){
    const r = DATA.reports[reportId];
    const {weld:w} = findWeld(weldId);
    const insp = w.inspections.find(i=>i.method===r.method);
    insp.photos.splice(idx,1);
    render();
  },
  setRemarks(reportId, weldId, v){
    const r = DATA.reports[reportId];
    const {weld:w} = findWeld(weldId);
    const insp = w.inspections.find(i=>i.method===r.method);
    insp.remarks = v;
  },
};

/* groups r.welds by part, preserving the order parts were first added — never interleaved (change 8) */
function weldGroupsForReport(r){
  const order = []; const map = {};
  r.welds.forEach(weldId=>{
    const found = findWeld(weldId);
    if(!found) return;
    const pid = found.part.id;
    if(!map[pid]){ map[pid] = {part:found.part, weldIds:[]}; order.push(pid); }
    map[pid].weldIds.push(weldId);
  });
  return order.map(pid=>map[pid]);
}
function reportWeldsCardHtml(r){
  const groups = weldGroupsForReport(r);
  const editable = r.status==='draft';
  const body = groups.length ? groups.map(g=>
    '<div style="margin-top:16px;">'+
      '<div style="font-size:17px;font-weight:700;color:var(--text);">'+g.part.id+' — '+esc(g.part.name)+'</div>'+
      '<div class="stack" style="gap:10px;margin-top:8px;">'+g.weldIds.map(id=>reportWeldRowHtml(r,id)).join('')+'</div>'+
    '</div>'
  ).join('') : '<div class="muted" style="margin-top:10px;">No welds yet — add some.</div>';
  return '<div class="card">'+
    '<div class="hstack" style="justify-content:space-between;">'+
      '<div class="section-title" style="margin:0;">Welds on this report ('+r.welds.length+')</div>'+

    '</div>'+
    body+
  '</div>';
}

    return '<span class="hint">'+(r.welds.length===0?'Add at least one weld.':allHaveResult?'All welds have a result — ready to sign.':'Every weld needs a result before this report can be signed.')+'</span>'+
      '<button class="btn btn-primary btn-lg" '+(allHaveResult?'':'disabled')+' onclick="ReportFlow.sign(\''+r.id+'\')">Sign &amp; save report</button>';

SCREENS.reportAddWelds = {
  topbar(params){ const r=DATA.reports[params.reportId]; return topbarBase({title:'Add welds', sub:r.method+' · '+r.id+' · any part in this assembly', variant:'assembly'}); },
  render(params){
    if(!state.addWeldsSelection || state.addWeldsSelectionReport!==params.reportId){
      state.addWeldsSelection = new Set();
      state.addWeldsSelectionReport = params.reportId;
    }
    const r = DATA.reports[params.reportId];
    // one long list spanning every part in the assembly, grouped under a part heading —
    // a report is never limited to the part it started on (change 8)
    const groups = []; const byPart = {};
    DATA.parts.forEach(part=>{
      if(part.blocked || part.assemblyId!==r.assemblyId) return;
      part.welds.forEach(w=>{
        const insp = w.inspections.find(i=>i.method===r.method);
        if(!insp || insp.reportId) return;
        if(!byPart[part.id]){ byPart[part.id] = {part, welds:[]}; groups.push(byPart[part.id]); }
        byPart[part.id].welds.push(w);
      });
    });
    const body = groups.map(g=>{
      const allSelected = g.welds.every(w=>state.addWeldsSelection.has(w.id));
      const rows = g.welds.map(w=>{
        const checked = state.addWeldsSelection.has(w.id);
        return '<div class="list-row" style="'+(checked?'border-color:var(--accent-text);background:rgba(234,179,8,.08);':'')+'" onclick="ReportFlow.toggleWeldSelect(\''+w.id+'\')">'+
          '<div class="weld-id">'+w.id+'</div>'+
          '<div class="row-meta"><div>'+w.type+' · '+w.process+' · '+w.position+'</div></div>'+
          (checked ? '<span style="color:var(--accent-text);">'+ICON.check+'</span>' : '')+
        '</div>';
      }).join('');
      return '<div style="margin-top:16px;">'+
        '<div class="hstack" style="justify-content:space-between;">'+
          '<div class="section-title" style="font-size:13px;margin:0;">'+g.part.id+' — '+esc(g.part.name)+'</div>'+
          '<button class="link-btn" onclick="ReportFlow.toggleSelectAllEligible(\''+g.part.id+'\',\''+params.reportId+'\')">'+(allSelected?'Deselect all':'Select all')+'</button>'+
        '</div>'+
        '<div class="stack" style="gap:8px;margin-top:8px;">'+rows+'</div>'+
      '</div>';
    }).join('');
    return '<div class="stack">'+(body || '<div class="muted" style="padding:24px;text-align:center;">No eligible '+r.method+' welds to add — every '+r.method+' inspection in this assembly is already on a report.</div>')+'</div>';
  },
  footer(params){
    const n = state.addWeldsSelection ? state.addWeldsSelection.size : 0;
    return '<button class="btn btn-outline btn-lg" onclick="App.back()">Cancel</button>'+
      '<button class="btn btn-primary btn-lg" '+(n===0?'disabled':'')+' onclick="ReportFlow.commitAddWelds(\''+params.reportId+'\')">Add '+n+' weld'+(n===1?'':'s')+'</button>';
  },
};
</script>

    const rows = p.welds.map((w,idx)=>{
      const s = w.session;
      return '<tr><td>'+asm.welder.name+'</td><td>'+WPS.id+'</td><td>'+asm.id+'</td><td>'+partId+'</td><td>'+w.id+'</td><td>Pass '+(idx%2===0?1:2)+'</td><td>'+(4+idx)+':'+(10+idx*3)+'</td><td>'+s.current+'A / '+s.voltage+'V</td></tr>';
    }).join('');
    return '<div class="wrap-table"><table class="ind"><thead><tr><th>Operator</th><th>WPS</th><th>Assembly</th><th>Part</th><th>Weld</th><th>Pass</th><th>Arc time</th><th>Avg I/V</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  },
};

SCREENS.serviceChecklist = {
  topbar(params){ const m=findMachine(params.machineId); return topbarBase({title:'Service checklist', sub:m.name, variant:'fleet'}); },
  render(params){
    if(!state.checklistDraft || state.checklistDraft.machineId!==params.machineId){
      state.checklistDraft = {machineId:params.machineId, items:CHECKLIST_ITEMS.map(label=>({label, result:null, note:'', hasPhoto:false}))};
    }
    const d = state.checklistDraft;
    const items = d.items.map((it,idx)=>
      '<div class="check-item">'+
        '<div class="hstack" style="justify-content:space-between;"><div style="font-weight:500;">'+it.label+'</div></div>'+
        '<div class="check-toggle">'+
          '<button class="check-btn pass'+(it.result==='pass'?' on':'')+'" onclick="Checklist.setResult('+idx+',\'pass\')">Pass</button>'+
          '<button class="check-btn fail'+(it.result==='fail'?' on':'')+'" onclick="Checklist.setResult('+idx+',\'fail\')">Fail</button>'+
        '</div>'+
        '<input class="input" placeholder="Notes (optional)" value="'+esc(it.note)+'" oninput="Checklist.setNote('+idx+',this.value)"/>'+
        '<button class="btn btn-outline" onclick="Checklist.togglePhoto('+idx+')">'+(it.hasPhoto?'✓ Photo attached':'Add photo')+'</button>'+
      '</div>'
    ).join('');
    return '<div class="stack">'+items+'</div>';
  },
  footer(){
    return '<button class="btn btn-fleet btn-lg" onclick="Checklist.save()">Save checklist</button>';
  },
};
const Checklist = {
  setResult(idx,v){ state.checklistDraft.items[idx].result=v; render(); },
  setNote(idx,v){ state.checklistDraft.items[idx].note=v; },
  togglePhoto(idx){ state.checklistDraft.items[idx].hasPhoto = !state.checklistDraft.items[idx].hasPhoto; render(); },
  save(){
    const d = state.checklistDraft;
    const incomplete = d.items.some(it=>!it.result);
    if(incomplete){ toast('Mark pass or fail for every item before saving'); return; }
    const passCount = d.items.filter(it=>it.result==='pass').length;
    const fails = d.items.filter(it=>it.result==='fail').map(it=>it.label);
    const summary = passCount+'/'+d.items.length+' passed'+(fails.length?', '+fails.length+' fail: '+fails.join(', '):'');
    const m = findMachine(d.machineId);
    m.service.log.unshift({t:demoDateStr(), summary});
    state.checklistDraft = null;
    queueOrToast('Service checklist saved for '+m.name);
    App.nav('machine', {machineId:d.machineId});
  },
};
</script>
<script>
/* ============================= WPS VIEW ============================= */
function wpsHeroHtml(){
  const cols = [
    ['Standard', WPS.standard],
    ['Weld type', WPS.weldType],
    ['Process', WPS.process],
    ['Base metal', WPS.material],
  ];
  return '<div class="card" style="padding:0;overflow:hidden;">'+
    '<div style="background:linear-gradient(90deg,var(--assembly-1),var(--assembly-2));color:var(--text-on-accent);padding:24px 26px;">'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;text-align:center;">'+
        cols.map(([label,val])=>'<div><div style="font-size:17px;font-weight:700;">'+esc(val)+'</div>'+
          '<div style="font-size:12px;opacity:.85;font-style:italic;margin-top:4px;">'+label+'</div></div>').join('')+
      '</div>'+
    '</div>'+
  '</div>';
}
function wpsNoValueHtml(){
  return '<div class="muted" style="display:flex;align-items:center;justify-content:center;">'+ICON.noValue.replace('<svg','<svg style="width:22px;height:22px;"')+'</div>';
}
function wpsMetricCardHtml(icon, label, valueHtml){
  return '<div class="card" style="text-align:center;">'+
    '<div class="hstack" style="justify-content:center;gap:8px;color:var(--text-muted);margin-bottom:10px;">'+
      icon.replace('<svg','<svg style="width:16px;height:16px;"')+'<span class="label-sm" style="margin:0;">'+label+'</span>'+
    '</div>'+
    valueHtml+
  '</div>';
}
function wpsPassRange(range, i, decimals){
  const band = (range[1]-range[0])/3;
  const f = v=>{ const p=Math.pow(10,decimals); return Math.round((range[0]+band*v)*p)/p; };
  return f(i)+'–'+f(i+1);
}
const WPS_PASSES = ['1 · Root','2 · Fill','3 · Cap'];

SCREENS.wps = {
  topbar(){ return topbarBase({title:WPS.id, sub:'Welding Procedure Specification · read-only', variant:'assembly'}); },
  render(){
    return '<div class="stack">'+
      wpsHeroHtml()+
      '<div class="grid2">'+
        wpsMetricCardHtml(ICON.ruler, 'Thickness', '<div style="font-size:19px;font-weight:700;">'+esc(WPS.thickness)+'</div>')+
        wpsMetricCardHtml(ICON.noValue, 'Diameter', '<div class="muted" style="font-size:13px;">Not applicable — plate joint</div>')+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">Additional variables · '+esc(WPS.process)+'</div>'+
        '<div class="grid2">'+
          '<div><div class="label-sm">Method</div><div class="val-lg">Semi-automatic</div></div>'+
          '<div><div class="label-sm">Polarity</div><div class="val-lg">DC+</div></div>'+
          '<div><div class="label-sm">Filler</div><div class="val-lg">'+esc(WPS.filler)+'</div></div>'+
          '<div><div class="label-sm">Shielding gas</div><div class="val-lg">'+esc(WPS.gas)+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;">'+
        wpsMetricCardHtml(ICON.thermometer, 'Preheat', '<div style="font-size:16px;font-weight:700;">'+esc(WPS.preheat)+'</div>')+
        wpsMetricCardHtml(ICON.thermometer, 'Interpass', '<div style="font-size:16px;font-weight:700;">'+esc(WPS.interpass)+'</div>')+
        wpsMetricCardHtml(ICON.thermometer, 'Post heat', wpsNoValueHtml())+
        wpsMetricCardHtml(ICON.thermometer, 'PWHT', wpsNoValueHtml())+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">Welding passes</div>'+
        '<div class="wrap-table"><table class="ind"><thead><tr>'+
          '<th>Pass</th><th>Process</th><th>Filler</th><th>Current (A)</th><th>Voltage (V)</th><th>Travel speed (cm/min)</th><th>Wire feed (m/min)</th><th>Heat input (kJ/mm)</th>'+
        '</tr></thead><tbody>'+
          WPS_PASSES.map((label,i)=>'<tr>'+
            '<td>'+label+'</td>'+
            '<td>'+esc(WPS.process)+'</td>'+
            '<td>'+esc(WPS.filler)+'</td>'+
            '<td>'+wpsPassRange(WPS.current,i,0)+'</td>'+
            '<td>'+wpsPassRange(WPS.voltage,i,1)+'</td>'+
            '<td>'+wpsPassRange(WPS.speed,i,0)+'</td>'+
            '<td>'+wpsPassRange(WPS.wireFeedSpeed,i,2)+'</td>'+
            '<td>'+wpsPassRange(WPS.heat,i,2)+'</td>'+
          '</tr>').join('')+
        '</tbody></table></div>'+
      '</div>'+
      '<div class="card"><div class="section-title">Positions &amp; acceptance</div>'+
        '<div class="hstack" style="gap:8px;flex-wrap:wrap;">'+WPS.positions.map(p=>'<span class="chip">'+p+'</span>').join('')+
          '<span class="chip" style="margin-left:auto;">'+esc(WPS.acceptance)+'</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  },
};

/* ============================= QR SCAN ============================= */
SCREENS.qrScan = {
  topbar(params){ return topbarBase({title: params.mode==='traceability' ? 'Confirm part' : 'Scan part QR', variant:'assembly'}); },
  render(params){
    const isTrace = params.mode==='traceability';
    const copy = isTrace
      ? 'Scan the part traveler to confirm you\'ve picked up the right part before you begin — a quick traceability check when several similar parts are in front of you.'
      : 'Point the tablet camera at the QR code printed on the part traveler. Works whether or not the part is assigned to you.';
    return '<div class="stack" style="align-items:center;text-align:center;margin-top:10px;">'+
      '<div class="scan-frame">'+
        '<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>'+
        '<div class="scan-line"></div>'+
      '</div>'+
      '<div class="muted" style="margin-top:16px;">'+copy+'</div>'+
      '<button class="btn btn-primary btn-lg" style="margin-top:18px;" onclick="QrScan.simulate(\''+(params.mode||'selfDirected')+'\',\''+(params.assemblyId||'')+'\')">Simulate scan</button>'+
    '</div>';
  },
};
const QrScan = {
  simulate(mode, assemblyId){
    if(mode==='traceability'){
      const asm = ASSEMBLIES[assemblyId];
      const part = DATA.parts.find(p=>p.assemblyId===assemblyId && p.assigned && !p.blocked) || DATA.parts.find(p=>p.assemblyId===assemblyId);
      toast('Confirmed — '+part.id+' · '+part.name+' matches '+asm.id);
      // if engineering already prepared a report for this part, go straight there —
      // scanning it shouldn't route through the "New report" flow
      const prepared = !partSummary(part).complete ? findPreparedReportForPart(part) : null;
      setTimeout(()=>{
        if(prepared) ReportFlow.openReport(prepared.id);
        else App.nav('part', {partId:part.id});
      }, 250);
    } else {
      // the self-directed path lands on a real part that has no assignment at all
      const part = findPart('P-07');
      toast('Scanned '+part.id+' — '+part.name);
      setTimeout(()=>{ App.nav('part', {partId:part.id}); }, 250);
    }
  },
};

/* ============================= ASSEMBLIES (change 10) ============================= */
/* Every assembly, part and weld the inspector has permission to see — scoped by site, not
   by assignment. Not just things assigned to them, not only things with inspections. */
SCREENS.assemblies = {
  topbar(){ return topbarBase({title:'Assemblies', sub:'Every assembly, part and weld at your sites', variant:'neutral'}); },
  render(){
    const f = state.assembliesFilter;
    return '<div class="stack">'+
      '<input class="search-input" placeholder="Search by assembly, part or weld…" value="'+esc(f.search||'')+'" oninput="AssembliesPage.setSearch(this.value)"/>'+
      '<label class="hstack" style="gap:10px;cursor:pointer;"><input type="checkbox" class="weld-check" style="width:22px;height:22px;" '+(f.onlyWithInspections?'checked':'')+' onclick="AssembliesPage.toggleOnlyWithInspections()"/><span style="font-size:14px;font-weight:500;">Only welds with inspections</span></label>'+
      '<div id="assembliesList"></div>'+
    '</div>';
  },
  after(){ renderAssembliesList(); },
};
function weldMatchesAssembliesFilter(part, w, q){
  if(!q) return true;
  const asm = assemblyFor(part);
  const hay = (asm.id+' '+asm.name+' '+part.id+' '+part.name+' '+w.id).toLowerCase();
  return hay.indexOf(q)!==-1;
}
function assembliesWeldRowHtml(part, w){
  const meta = w.type+' · '+w.process+' · '+w.position;
  const chips = (w.inspections||[]).map(i=>{
    const cls = i.result==='Acceptable'?'badge-success':i.result==='Failed'?'badge-error':'badge-muted';
    return '<span class="badge '+cls+'">'+i.method+(i.result?' · '+i.result:'')+'</span>';
  }).join(' ');
  const hasInspections = w.inspections && w.inspections.length;
  const createBtn = !hasInspections
    ? (part.blocked
        ? '<span class="muted" style="font-size:12px;">Weld not yet complete</span>'
        : '<button class="btn btn-outline" style="min-height:38px;padding:0 12px;font-size:13px;" onclick="event.stopPropagation();AssembliesPage.createInspection(\''+w.id+'\')">Create inspection</button>')
    : '';
  return '<div class="list-row" onclick="App.nav(\'weld\',{weldId:\''+w.id+'\'})">'+
    '<div class="weld-id">'+w.id+'</div>'+
    '<div class="row-meta"><div>'+meta+'</div></div>'+
    '<div class="hstack" style="gap:6px;flex-wrap:wrap;">'+(chips||'<span class="muted" style="font-size:13px;">No inspections</span>')+'</div>'+
    createBtn+
    '<span class="chevron">'+ICON.chevron+'</span>'+
  '</div>';
}
function renderAssembliesList(){
  const host = document.getElementById('assembliesList');
  if(!host) return;
  const f = state.assembliesFilter;
  const q = (f.search||'').toLowerCase().trim();
  const sections = Object.values(ASSEMBLIES).map(asm=>{
    const parts = DATA.parts.filter(p=>p.assemblyId===asm.id);
    const partSections = parts.map(part=>{
      const welds = part.welds.filter(w=>{
        if(f.onlyWithInspections && (!w.inspections || !w.inspections.length)) return false;
        return weldMatchesAssembliesFilter(part, w, q);
      });
      if(!welds.length) return '';
      return '<div style="margin-top:14px;">'+
        '<div style="font-weight:600;font-size:15px;">'+part.id+' · '+esc(part.name)+(part.assigned?'':' <span class="badge badge-info" style="margin-left:6px;">Unassigned</span>')+(part.blocked?' <span class="badge badge-muted" style="margin-left:6px;">Blocked</span>':'')+'</div>'+
        '<div class="stack" style="gap:8px;margin-top:8px;">'+welds.map(w=>assembliesWeldRowHtml(part,w)).join('')+'</div>'+
      '</div>';
    }).filter(Boolean).join('');
    if(!partSections) return '';
    return '<div class="card">'+
      '<div class="section-title" style="margin-bottom:0;">'+esc(asm.name)+'</div>'+
      '<div class="muted" style="font-size:13px;">'+asm.id+' · '+esc(asm.site)+'</div>'+
      partSections+
    '</div>';
  }).filter(Boolean).join('');
  host.innerHTML = '<div class="stack">'+(sections || '<div class="muted" style="padding:24px;text-align:center;">No matching assemblies, parts or welds.</div>')+'</div>';
}
const AssembliesPage = {
  setSearch(v){ state.assembliesFilter.search = v; renderAssembliesList(); },
  toggleOnlyWithInspections(){ state.assembliesFilter.onlyWithInspections = !state.assembliesFilter.onlyWithInspections; render(); },
  createInspection(weldId){
    state.pendingInspectionScope = {weldId};
    Modal.open(testTypePickerHtml(Object.keys(METHOD_INFO), 'AssembliesPage.chooseMethod'));
  },
  chooseMethod(method){
    const scope = state.pendingInspectionScope;
    const {weld:w} = findWeld(scope.weldId);
    w.inspections.push(makeInspection(method, INSPECTOR.name));
    Modal.close();
    queueOrToast(method+' inspection created on '+scope.weldId+' — ready to add to a report');
    App.nav('weld', {weldId:scope.weldId});
  },
};

/* ============================= NDT REPORTS (finished-report history) ============================= */
function reportPartsInvolved(r){
  const ids = r.welds.map(weldId=>{ const found = findWeld(weldId); return found ? found.part.id : null; }).filter(Boolean);
  return Array.from(new Set(ids));
}
function reportMatchesHistoryFilter(r, f, q){
  if(f.method!=='all' && r.method!==f.method) return false;
  if(f.assemblyId!=='all' && r.assemblyId!==f.assemblyId) return false;
  if(!q) return true;
  const asm = ASSEMBLIES[r.assemblyId];
  const partWords = reportPartsInvolved(r).map(id=>{ const p=findPart(id); return p ? p.id+' '+p.name : id; }).join(' ');
  const hay = (r.id+' '+r.method+' '+asm.id+' '+asm.name+' '+partWords+' '+(r.signedBy||'')).toLowerCase();
  return hay.indexOf(q)!==-1;
}
function reportsHistoryRowHtml(r){
  const asm = ASSEMBLIES[r.assemblyId];
  const partIds = reportPartsInvolved(r);
  const isDraft = r.status==='draft';
  const rightCol = isDraft
    ? '<span class="badge '+(r.preparedByEngineering?'badge-info':'badge-warning')+'">'+(r.preparedByEngineering?'Prepared':'Draft')+'</span>'
    : esc(r.signedBy||'')+'<br>'+esc(r.signedAt||'');
  return '<div class="list-row" onclick="App.nav(\'report\',{reportId:\''+r.id+'\'})">'+
    '<div class="weld-id" style="min-width:112px;">'+r.id+'</div>'+
    '<div class="row-meta">'+
      '<div>'+r.method+' — '+esc(asm.name)+'</div>'+
      '<div class="top">'+(partIds.join(', ')||'—')+' · '+r.welds.length+' weld'+(r.welds.length===1?'':'s')+'</div>'+
    '</div>'+
    '<div class="muted" style="font-size:13px;text-align:right;white-space:nowrap;">'+rightCol+'</div>'+
    '<span class="chevron">'+ICON.chevron+'</span>'+
  '</div>';
}
function renderReportsHistoryList(){
  const host = document.getElementById('reportsHistoryList');
  if(!host) return;
  const f = state.reportsFilter;
  const q = (f.search||'').toLowerCase().trim();
  const wantDrafts = f.tab==='drafts';
  const scoped = Object.values(DATA.reports).filter(r=> wantDrafts ? r.status==='draft' : r.status==='signed');
  const rows = scoped
    .filter(r=>reportMatchesHistoryFilter(r, f, q))
    .sort((a,b)=> wantDrafts ? b.id.localeCompare(a.id) : (b.signedAt||'').localeCompare(a.signedAt||''))
    .map(reportsHistoryRowHtml).join('');
  const empty = scoped.length===0
    ? (wantDrafts ? 'No draft reports yet — start one from a part’s weld list.' : 'No signed reports yet — finished reports will show up here once signed.')
    : 'No reports match your search or filters.';
  host.innerHTML = '<div class="stack" style="gap:10px;">'+(rows || '<div class="muted" style="padding:24px;text-align:center;">'+empty+'</div>')+'</div>';
}
SCREENS.reports = {
  topbar(){ return topbarBase({title:'NDT reports', sub:'Draft and signed reports', variant:'neutral'}); },
  render(){
    const f = state.reportsFilter;
    const draftCount = draftReportsList().length;
    const signedCount = Object.values(DATA.reports).filter(r=>r.status==='signed').length;
    const tabChips = '<button class="filter-chip'+(f.tab==='drafts'?' on':'')+'" onclick="ReportsHistory.setTab(\'drafts\')">Drafts ('+draftCount+')</button>'+
      '<button class="filter-chip'+(f.tab==='signed'?' on':'')+'" onclick="ReportsHistory.setTab(\'signed\')">Signed ('+signedCount+')</button>';
    const methodChips = ['all'].concat(Object.keys(METHOD_INFO)).map(m=>
      '<button class="filter-chip'+(f.method===m?' on':'')+'" onclick="ReportsHistory.setMethod(\''+m+'\')">'+(m==='all'?'All methods':m)+'</button>'
    ).join('');
    const asmChips = ['all'].concat(Object.keys(ASSEMBLIES)).map(id=>
      '<button class="filter-chip'+(f.assemblyId===id?' on':'')+'" onclick="ReportsHistory.setAssembly(\''+id+'\')">'+(id==='all'?'All assemblies':esc(ASSEMBLIES[id].name))+'</button>'
    ).join('');
    return '<div class="stack">'+
      '<div class="filter-row">'+tabChips+'</div>'+
      '<input class="search-input" placeholder="Search by report number, part, assembly or inspector…" value="'+esc(f.search)+'" oninput="ReportsHistory.setSearch(this.value)"/>'+
      '<div class="filter-row">'+methodChips+'</div>'+
      '<div class="filter-row">'+asmChips+'</div>'+
      '<div id="reportsHistoryList"></div>'+
    '</div>';
  },
  after(){ renderReportsHistoryList(); },
};
const ReportsHistory = {
  setTab(t){ state.reportsFilter.tab = t; render(); },
  setSearch(v){ state.reportsFilter.search = v; renderReportsHistoryList(); },
  setMethod(m){ state.reportsFilter.method = m; render(); },
  setAssembly(id){ state.reportsFilter.assemblyId = id; render(); },
};
</script>
<script>
/* ============================= FACILITATOR (change 12) ============================= */
/* Demo shortcuts for whoever is running the prototype — reset, offline toggle, jump a weld
   to repair, and seed a draft report spanning two parts so the grouped multi-part welds
   card (change 8) is on screen without ten setup taps. Never shown to a real inspector. */
const Facilitator = {
  open(){
    Modal.open(
      '<h2>Facilitator controls</h2>'+
      '<p class="muted" style="margin-bottom:14px;">Demo-only shortcuts — not part of the product.</p>'+
      '<div class="stack" style="gap:8px;">'+
        '<button class="btn btn-outline btn-block" onclick="Facilitator.toggleOffline()">'+(state.offline?'Go online':'Go offline')+'</button>'+
        '<button class="btn btn-outline btn-block" onclick="Facilitator.jumpToRepair()">Jump a weld to repair</button>'+
        '<button class="btn btn-outline btn-block" onclick="Facilitator.seedMultiPartDraft()">Seed a multi-part VT draft report</button>'+
        '<button class="btn btn-danger btn-block" onclick="Facilitator.reset()">Reset demo data</button>'+
      '</div>'+
      '<div class="modal-actions"><button class="btn btn-outline" onclick="Modal.close()">Close</button></div>'
    );
  },
  toggleOffline(){
    state.offline = !state.offline;
    const nowOffline = state.offline;
    Modal.close();
    toast(nowOffline ? 'Now offline — actions will queue' : 'Back online — queued actions will sync');
    render();
  },
  jumpToRepair(){
    const found = findWeld('W-005');
    if(found){
      const {weld:w} = found;
      const insp = w.inspections[0];
      if(insp){
        insp.result = 'Failed';
        if(!w.ncr) w.ncr = 'NCR-2026-'+String(DATA.ncrCounter++).padStart(4,'0');
        w.status = 'Not acceptable';
        w.disposition = 'awaiting QA';
        w.stage = 'Welding';
      }
    }
    Modal.close();
    queueOrToast('W-005 jumped to repair — NCR raised');
    App.nav('weld', {weldId:'W-005'});
  },
  seedMultiPartDraft(){
    const p01 = findPart('P-01'), p03 = findPart('P-03');
    const r = ReportFlow.createNewSilent('VT', 'ASM-2026-0412', null);
    r.title = 'VT — Base Frame + Pump Skid Bracket';
    [p01.welds[0].id, p01.welds[1].id, p03.welds[0].id].forEach(id=>{
      const f = findWeld(id);
      if(f && f.weld.inspections.some(i=>i.method==='VT' && !i.reportId)) addWeldToReport(r.id, id);
    });
    Modal.close();
    queueOrToast('Seeded multi-part draft '+r.id);
    App.nav('report', {reportId:r.id});
  },
  reset(){
    DATA = seedData();
    state.stack = [{screen:'home', params:{}}];
    state.partSelection = null;
    state.addWeldsSelection = null;
    Modal.close();
    toast('Demo data reset');
    App.home();
  },
};
</script>
<script>
/* ============================= INIT ============================= */
window.addEventListener('DOMContentLoaded', ()=>{ render(); });
</script>
