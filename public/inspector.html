<title>WeldCloud Inspect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* semantic tokens mirrored from the Welder app's palette (src/globals.css) so both
     apps in the WeldCloudLink suite read as one product — light values here */
  --bg-page:#f0ede8;
  --surface-app:#f0ede8;
  --surface-card:#ffffff;
  --surface-raised:#eceae5;
  --surface-sunken:#f0ede8;
  --border:#d5d2cc;
  --border-strong:#b8b4ac;
  --text:#111111;
  --text-secondary:#3d3c3a;
  --text-muted:#6b6865;
  --text-dim:#948f89;
  --text-on-accent:#000000;
  --assembly-1:#eab308;
  --assembly-2:#facc15;
  --assembly-solid:#eab308;
  --accent-text:#a16207;
  --success:#16a34a;
  --error:#dc2626;
  --warning:#f97316;
  --info:#0284c7;
  --mandatory:#dc2626;
  --stage-waiting:#9AA0A6;
  --stage-fitted:#2E5B78;
  --stage-welded:#F2AA3C;
  --stage-pwht:#C98CAE;
  --stage-tested:#B35591;
  --stage-finished:#3B6F3E;
  --stage-shipped:#5245A1;
  --shadow-1:0 1px 2px rgba(26,23,27,.08);
  --shadow-2:0 4px 14px rgba(26,23,27,.14);
  --shadow-modal:0 20px 60px rgba(0,0,0,.35);
  --badge-success-bg:rgba(76,175,80,.14);
  --badge-success-fg:#2f7a33;
  --badge-warning-bg:rgba(249,115,22,.14);
  --badge-warning-fg:#9a3412;
  --badge-purple-bg:rgba(234,179,8,.16);
  --badge-purple-fg:#8a5c04;
}
/* light is the default regardless of OS preference — dark only applies when the
   inspector explicitly toggles it via the theme button (data-theme="dark") */
:root[data-theme="dark"]{
  --bg-page:#0f0f0f;
  --surface-app:#141414;
  --surface-card:#1a1a1a;
  --surface-raised:#1f1f1f;
  --surface-sunken:#0f0f0f;
  --border:#2a2a2a;
  --border-strong:#3a3a3a;
  --text:#ffffff;
  --text-secondary:#d1d5db;
  --text-muted:#9ca3af;
  --text-dim:#6b7280;
  --accent-text:#eab308;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 4px 18px rgba(0,0,0,.5);
  --shadow-modal:0 20px 60px rgba(0,0,0,.6);
  --badge-success-bg:rgba(76,175,80,.22);
  --badge-success-fg:#7bd47f;
  --badge-warning-bg:rgba(249,115,22,.22);
  --badge-warning-fg:#fdba74;
  --badge-purple-bg:rgba(234,179,8,.22);
  --badge-purple-fg:#f4c15e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-page);
  color:var(--text);
  font-family:'Roboto',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
h1,h2,h3,h4{
  font-family:'Museo Sans','Roboto',sans-serif;
  font-weight:700;
  margin:0;
  text-wrap:balance;
}
button{font-family:inherit;}
::selection{background:var(--assembly-solid);color:var(--text-on-accent);}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;}

/* ---- app shell: fills the remaining viewport, no device-frame chrome ---- */
.screen{
  flex:1;min-height:0;
  width:100%;
  background:var(--surface-app);
  display:flex;flex-direction:column;
  position:relative;
}
/* topbar now runs the full width of the page; rail + content sit in a row below it */
.below-topbar{flex:1;min-height:0;display:flex;}

/* ---- rail ---- */
.rail{
  width:76px;flex:0 0 76px;
  background:var(--surface-card);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 0;gap:6px;
  overflow-y:auto;
}
.rail-btn{
  width:56px;height:56px;border-radius:14px;border:none;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-muted);cursor:pointer;transition:background .12s ease, transform .08s ease;
}
.rail-btn svg{width:22px;height:22px;}
.rail-btn span{font-size:10px;font-weight:500;}
.rail-btn:active{transform:scale(.94);}
.rail-btn.active{background:var(--surface-sunken);color:var(--accent-text);}
.rail-btn:not(.active):active{background:var(--surface-sunken);}

/* ---- main column ---- */
.col{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  min-height:64px;flex:0 0 auto;
  display:flex;align-items:center;gap:14px;
  padding:0 22px;
  color:var(--text);
  background:var(--surface-card);
  border-bottom:1px solid var(--border);
}
.topbar-logo{
  width:44px;height:44px;min-width:44px;border-radius:12px;border:none;
  background:var(--assembly-solid);color:var(--text-on-accent);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  transition:transform .08s ease;
}
.topbar-logo svg{width:22px;height:22px;}
.topbar-logo:active{transform:scale(.93);}
.back-btn{
  width:44px;height:44px;min-width:44px;border-radius:12px;border:none;
  background:var(--surface-sunken);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.back-btn:active{transform:scale(.93);}
.topbar h1{font-size:19px;letter-spacing:.01em;}
.topbar .sub{font-size:12px;opacity:.75;font-weight:400;margin-top:1px;color:var(--text-muted);}
.topbar .crumb-link{color:inherit;cursor:pointer;}
.topbar .crumb-link:hover{text-decoration:underline;}
.topbar .crumb-sep{opacity:.5;margin:0 5px;}
.topbar .grow{flex:1;min-width:0;}
.topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.pill{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:500;
  background:var(--surface-sunken);border:1px solid var(--border);color:var(--text);white-space:nowrap;
}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.icon-toggle{
  width:44px;height:44px;border-radius:12px;border:none;background:var(--surface-sunken);
  color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-toggle:active{transform:scale(.93);}
.avatar{
  width:36px;height:36px;border-radius:50%;background:var(--assembly-solid);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text-on-accent);flex:0 0 auto;
}

.content{flex:1;overflow-y:auto;padding:22px 26px 100px;position:relative;}
.content.no-pad-b{padding-bottom:26px;}

/* ---- generic bits ---- */
.section-title{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);
  margin:0 0 12px;
}
.stack{display:flex;flex-direction:column;gap:14px;}
.hstack{display:flex;align-items:center;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{
  background:var(--surface-card);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-1);padding:18px;
}
.card.tap{cursor:pointer;transition:transform .08s ease, box-shadow .15s ease;}
.card.tap:active{transform:scale(.985);box-shadow:var(--shadow-1);}
.card.disabled{opacity:.62;cursor:not-allowed;}
.muted{color:var(--text-muted);}
.label-sm{font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;}
.val-lg{font-size:18px;font-weight:500;color:var(--text);}
.divider{height:1px;background:var(--border);margin:14px 0;}

.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:13px;font-weight:500;
  white-space:nowrap;
}
.badge-success{background:var(--badge-success-bg);color:var(--badge-success-fg);}
.badge-error{background:rgba(220,38,38,.12);color:var(--error);}
.badge-warning{background:var(--badge-warning-bg);color:var(--badge-warning-fg);}
.badge-info{background:rgba(2,132,199,.12);color:var(--info);}
.badge-purple{background:var(--badge-purple-bg);color:var(--badge-purple-fg);}
.badge-muted{background:var(--surface-sunken);color:var(--text-muted);border:1px solid var(--border);}

.chip{
  display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:500;
  background:var(--surface-sunken);border:1px solid var(--border);color:var(--text-secondary);
}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.filter-chip{
  padding:8px 14px;border-radius:20px;border:1.5px solid var(--border-strong);background:var(--surface-sunken);
  color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
}
.filter-chip:active{transform:scale(.96);}
.filter-chip.on{background:var(--assembly-solid);border-color:var(--assembly-solid);color:var(--text-on-accent);}

.report-title{
  width:100%;border:1.5px solid transparent;background:transparent;border-radius:10px;
  font-family:'Museo Sans','Roboto',sans-serif;font-weight:700;font-size:23px;color:var(--text);
  padding:8px 10px;margin:0 0 2px -10px;
}
.report-title:hover{background:var(--surface-sunken);border-color:var(--border);}
.report-title:focus{background:var(--surface-card);border-color:var(--accent-text);outline:none;}
.report-title[disabled]{color:var(--text);opacity:1;cursor:default;}
.report-title[disabled]:hover{background:transparent;border-color:transparent;}
.report-title::placeholder{color:var(--text-muted);font-weight:500;}

.btn{
  border:none;border-radius:12px;font-weight:500;font-size:15px;cursor:pointer;
  min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease, filter .12s ease, background .12s ease;
}
.btn:active{transform:scale(.96);}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--assembly-solid);color:var(--text-on-accent);}
.btn-fleet{background:var(--assembly-solid);color:var(--text-on-accent);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--error);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--border-strong);color:var(--text);}
.btn-ghost{background:var(--surface-sunken);color:var(--text);}
.btn-lg{min-height:56px;font-size:16px;padding:0 26px;font-weight:700;}
.btn-block{width:100%;}

.footer-bar{
  flex:0 0 auto;padding:14px 26px;display:flex;align-items:center;justify-content:flex-end;gap:12px;
  background:var(--surface-card);border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
.footer-bar .hint{margin-right:auto;font-size:13px;color:var(--text-muted);}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.03em;}
.field .req::after{content:' *';color:var(--mandatory);}
.input, .select, textarea.input{
  border:1.5px solid var(--border-strong);border-radius:10px;padding:12px 14px;font-size:16px;
  background:var(--surface-card);color:var(--text);min-height:48px;font-family:inherit;width:100%;
}
textarea.input{min-height:90px;resize:vertical;}
.keypad-display{
  border:1.5px solid var(--border-strong);border-radius:10px;padding:12px 14px;font-size:20px;
  background:var(--surface-card);color:var(--text);min-height:52px;width:100%;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;font-variant-numeric:tabular-nums;
}
.keypad-display .unit{color:var(--text-muted);font-size:14px;}
.keypad-display.empty{color:var(--text-muted);}

.list-row{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--surface-card);
  border:1px solid var(--border);cursor:pointer;transition:transform .08s ease,background .12s ease;
}
.list-row:active{transform:scale(.985);background:var(--surface-sunken);}
.list-row.locked{cursor:default;opacity:.65;}
.list-row.locked:active{transform:none;}
.weld-id{font-size:18px;font-weight:700;min-width:74px;}
.weld-check{width:32px;height:32px;flex:0 0 auto;accent-color:var(--assembly-solid);cursor:pointer;}
.row-meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.row-meta .top{font-size:14px;color:var(--text-muted);}
.chevron{color:var(--text-muted);flex:0 0 auto;}

.dot-ind{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.param-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.param-row:last-child{border-bottom:none;}
.param-name{font-size:14px;color:var(--text-secondary);font-weight:500;}
.param-vals{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;}
.param-recorded{font-size:18px;font-weight:500;}
.param-range{font-size:12px;color:var(--text-muted);}

.stage-track{display:flex;gap:3px;border-radius:8px;overflow:hidden;height:8px;}
.stage-seg{flex:1;background:var(--border);}
.stage-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.stage-legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
.stage-legend .sw{width:10px;height:10px;border-radius:3px;}

/* modal / overlay */
.overlay{
  position:absolute;inset:0;background:rgba(10,10,10,.5);display:flex;align-items:center;justify-content:center;
  z-index:40;padding:24px;
}
.modal{
  background:var(--surface-raised);border-radius:18px;box-shadow:var(--shadow-modal);
  max-width:560px;width:100%;max-height:90%;overflow-y:auto;padding:24px;
}
.modal h2{font-size:20px;margin-bottom:6px;}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.keypad-overlay{align-items:flex-end;}
.keypad-sheet{
  background:var(--surface-raised);border-radius:20px 20px 0 0;box-shadow:var(--shadow-modal);
  width:420px;max-width:100%;padding:20px;
}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.key{
  min-height:56px;border-radius:12px;background:var(--surface-sunken);border:1px solid var(--border);
  font-size:20px;font-weight:500;color:var(--text);cursor:pointer;
}
.key:active{transform:scale(.94);background:var(--border);}
.key.wide{grid-column:span 1;}
.key.done{background:var(--assembly-solid);color:var(--text-on-accent);grid-row:span 2;}

/* reason picker */
.search-input{
  width:100%;border:1.5px solid var(--border-strong);border-radius:12px;padding:14px 16px;font-size:16px;
  background:var(--surface-card);color:var(--text);margin-bottom:14px;
}
.reason-row{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface-card);cursor:pointer;margin-bottom:10px;
}
.reason-row:active{transform:scale(.985);}
.reason-row.selected{border-color:var(--accent-text);background:rgba(234,179,8,.08);}
.reason-code{font-size:18px;font-weight:700;min-width:56px;color:var(--accent-text);}

/* photo annotate */
.photo-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:crosshair;user-select:none;}
.marker{
  position:absolute;width:30px;height:30px;border-radius:50%;background:var(--error);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 2px 6px rgba(0,0,0,.4);
}

/* toast */
.toast-wrap{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60;align-items:flex-end;}
.toast{
  background:var(--text);color:var(--surface-card);padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-2);max-width:320px;animation:toastin .18s ease-out;
}
:root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{background:#3a3a3c;color:#f1efed;}
@keyframes toastin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

.banner{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;
  margin-bottom:16px;
}
.banner-warning{background:var(--badge-warning-bg);color:var(--badge-warning-fg);border:1px solid var(--warning);}
.banner-info{background:rgba(2,132,199,.1);color:var(--info);border:1px solid rgba(2,132,199,.3);}

.history-block{background:var(--surface-sunken);border:1px dashed var(--border-strong);border-radius:14px;padding:16px;}
.history-block .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}

.scan-frame{
  width:280px;height:280px;margin:0 auto;position:relative;border-radius:20px;background:var(--surface-sunken);
}
.scan-frame .corner{position:absolute;width:36px;height:36px;border:4px solid var(--accent-text);}
.scan-frame .c1{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:8px 0 0 0;}
.scan-frame .c2{top:14px;right:14px;border-left:none;border-bottom:none;border-radius:0 8px 0 0;}
.scan-frame .c3{bottom:14px;left:14px;border-right:none;border-top:none;border-radius:0 0 0 8px;}
.scan-frame .c4{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 8px 0;}
.scan-line{position:absolute;left:14px;right:14px;height:3px;background:var(--accent-text);border-radius:2px;box-shadow:0 0 10px var(--accent-text);animation:scan 1.4s ease-in-out infinite;}
@keyframes scan{0%{top:20px;}50%{top:250px;}100%{top:20px;}}
@media (prefers-reduced-motion: reduce){.scan-line{animation:none;top:120px;}}

.check-item{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--surface-card);}
.check-toggle{display:flex;gap:10px;}
.check-btn{flex:1;min-height:48px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--surface-sunken);font-weight:500;color:var(--text);cursor:pointer;}
.check-btn.pass.on{background:rgba(76,175,80,.16);border-color:var(--success);color:#2f7a33;}
.check-btn.fail.on{background:rgba(226,57,0,.12);border-color:var(--error);color:var(--error);}

.wrap-table{overflow-x:auto;border-radius:14px;border:1px solid var(--border);}
table.ind{width:100%;border-collapse:collapse;min-width:640px;background:var(--surface-card);}
table.ind th{background:var(--surface-sunken);text-align:left;font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;}
table.ind td{padding:12px;font-size:15px;border-top:1px solid var(--border);}

.result-toggle{display:flex;gap:12px;}
.result-btn{flex:1;min-height:64px;border-radius:14px;border:2px solid var(--border-strong);background:var(--surface-card);font-size:17px;font-weight:700;cursor:pointer;color:var(--text);}
.result-btn.acceptable.on{border-color:var(--success);background:rgba(76,175,80,.12);color:#2f7a33;}
.result-btn.failed.on{border-color:var(--error);background:rgba(226,57,0,.1);color:var(--error);}

.thumb-strip{display:flex;gap:10px;flex-wrap:wrap;}
.thumb{width:84px;height:64px;border-radius:8px;border:1px solid var(--border);position:relative;overflow:hidden;}
.thumb .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;padding:0;}
.thumb .rm svg{width:11px;height:11px;}
.thumb-add{width:84px;height:64px;border-radius:8px;border:1.5px dashed var(--border-strong);background:var(--surface-sunken);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-muted);cursor:pointer;font-size:10px;font-weight:500;}
.thumb-add svg{width:18px;height:18px;}
.thumb-add:active{transform:scale(.94);}

.select-display{
  border:1.5px solid var(--border-strong);border-radius:10px;padding:12px 14px;font-size:16px;
  background:var(--surface-sunken);color:var(--text);min-height:48px;width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.select-display svg{width:16px;height:16px;color:var(--text-muted);flex:0 0 auto;}
.date-display{display:flex;align-items:center;gap:0;border:1.5px solid var(--border-strong);border-radius:10px;overflow:hidden;background:var(--surface-sunken);min-height:48px;}
.date-display .txt{flex:1;padding:12px 14px;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;}
.date-display .cal{width:44px;height:48px;background:var(--mandatory);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.date-display .cal svg{width:18px;height:18px;}

.collapsible .head{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:16px 18px;
  background:var(--surface-sunken);margin:-18px -18px 0;border-radius:16px 16px 0 0;
}
.collapsible .head h3{font-size:16px;font-weight:500;font-family:'Roboto',sans-serif;}
.collapsible .head svg{width:18px;height:18px;color:var(--text-muted);transition:transform .15s ease;}
.collapsible .head.closed svg{transform:rotate(180deg);}
.collapsible .body{padding-top:18px;}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--info);font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;padding:0;}
.link-btn svg{width:14px;height:14px;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}

/* ---- responsive: tablet is the primary target, this just keeps phone-width viewports usable ---- */
@media (max-width:720px){
  .rail{width:60px;flex:0 0 60px;padding:10px 0;}
  .rail-btn{width:48px;height:48px;}
  .rail-btn span{display:none;}
  .topbar{padding:0 14px;gap:10px;}
  .topbar-logo{width:38px;height:38px;min-width:38px;}
  .topbar-logo svg{width:19px;height:19px;}
  .content{padding:16px 16px 100px;}
  .content.no-pad-b{padding-bottom:16px;}
}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr;}
  .footer-bar{padding:12px 16px;}
}

/* shared report shape — both engineering-prepared and inspector-created reports build from this */
function makeReportBase(id, method, assemblyId, scopePartId, date){
  const info = METHOD_INFO[method];
  return {
    id, method, assemblyId, scopePartId: scopePartId||null,
    title:'', created:date, welds:[], status:'draft', signedBy:null, signedAt:null,
    date, site:ASSEMBLIES[assemblyId].site,
    procedure:info.procedure, acceptance:info.acceptance,
    notes:'', pdfAttached:false, photos:[],
    testTypeVars: defaultTestTypeVars(method),
    ndtMaterials: [],
    sectionsOpen:{identity:false, procedure:false},
  };
}

/* engineering-prepared report: seeded already attached to every matching inspection on the
   part, so for parts like these the inspector's job is purely to work through welds —
   not to create the report themselves */
function makePreparedReport(id, method, assemblyId, part, title, date){
  const report = makeReportBase(id, method, assemblyId, part.id, date);
  report.preparedByEngineering = true; // doesn't count against the inspector's own concurrent-draft cap
  report.title = title;
  report.notes = 'Prepared by welding engineering — work through each weld below.';
  part.welds.forEach(w=>{
    const insp = w.inspections.find(i=>i.method===method);
    if(insp){ insp.reportId = id; report.welds.push(w.id); }
  });
  return report;
}

function makeWeld(o){
  return Object.assign({
    status:'Pending', stage:'Testing', ncr:null, records:[], photo:null, inspections:[],
    detailSectionsOpen:{traceability:false, groove:false},
  }, o);
}

/* ---- weld sessions (arc passes recorded by the welding machine for a weld) ---- */
const PASS_LABELS = ['Root pass','Fill pass','Cap pass'];

function sessionChartSeries(current,voltage,power,wfs){
  const arr = [];
  for(let t=0;t<5;t++){
    const wobble = Math.sin(t*1.3)*0.05+1;
    arr.push({
      wfs:Math.round(wfs*wobble*100)/100,
      current:Math.round(current*wobble),
      voltage:Math.round(voltage*wobble*10)/10,
      power:Math.round(power*wobble*10)/10,
    });
  }
  return arr;
}

function chartAvg(chart, key){
  return chart.reduce((sum,d)=>sum+d[key],0)/chart.length;
}

/* metrics that carry a WPS-defined tolerance band, shown as limit lines on the session charts */
const METRIC_RANGES = {
  wfs: {wps:()=>WPS.wireFeedSpeed, decimals:2},
  current: {wps:()=>WPS.current, decimals:0},
  voltage: {wps:()=>WPS.voltage, decimals:1},
  power: {wps:()=>WPS.power, decimals:1},
};

function rangeStatus(chart, key){
  const range = METRIC_RANGES[key].wps();
  const vals = chart.map(d=>d[key]);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const pointBreaches = vals.map(v=>v<range[0]||v>range[1]);
  return {
    range,
    avg,
    avgBreach: avg<range[0] || avg>range[1],
    pointBreaches,
    hasPointBreach: pointBreaches.some(Boolean),
  };
}

function genSessions(base, count, operatorName){
  const passes = PASS_LABELS.slice(0, count);
  return passes.map((pass, i)=>{
    const factor = 1 - (count-1-i)*0.04;
    const current = Math.round(base.current*factor);
    const voltage = Math.round(base.voltage*factor*10)/10;
    const speed = Math.round(base.speed/factor);
    const power = Math.round(current*voltage/1000*10)/10;
    const wfs = Math.round(base.speed*0.014*factor*100)/100;
    const chart = sessionChartSeries(current, voltage, power, wfs);
    const fusionRate = Math.round(power*1.65*10)/10;
    const arcSeconds = 150 + i*45;
    return {
      id:pass.toLowerCase().replace(' ','-'),
      pass, operator:operatorName,
      // "WPS Parameter ID" — the pass row this session is judged against. Sessions are
      // never averaged together; each is compared only to its own parameter row.
      wpsParamId:WPS.id+' · Pass '+(i+1),
      timestamp:'Today '+String(8+i).padStart(2,'0')+':'+String(10+i*7).padStart(2,'0'),
      arcSeconds,
      current:Math.round(chartAvg(chart,'current')),
      voltage:Math.round(chartAvg(chart,'voltage')*10)/10,
      speed, power:Math.round(chartAvg(chart,'power')*10)/10,
      wfs:Math.round(chartAvg(chart,'wfs')*100)/100,
      fusionRate,
      chart,
      events: (count>1 && i===count-1) ? [{time:'00:02', timestamp:'4:38:29 AM Aug 25, 2026', category:'Machine stop', message:'Communication error (bus off)'}] : [],
    };
  });
}

/* grey — a tack weld, not judged against WPS welding parameters at all */
function makeTackSession(operatorName){
  return {
    id:'tack', pass:'Tack weld', operator:operatorName, wpsParamId:WPS.id+' · Tack',
    timestamp:'Today 07:52', arcSeconds:35,
    current:90, voltage:16, speed:0, power:1.4, wfs:0.2, fusionRate:0,
    chart:sessionChartSeries(90,16,1.4,0.2), events:[], tack:true,
  };
}
/* teal — the weld is currently being performed; nothing to judge yet */
function makeInProgressSession(operatorName){
  return {
    id:'live', pass:'Fill pass', operator:operatorName, wpsParamId:WPS.id+' · Pass 2',
    timestamp:'Now', arcSeconds:40,
    current:240, voltage:26, speed:30, power:6.2, wfs:0.5, fusionRate:10,
    chart:sessionChartSeries(240,26,6.2,0.5), events:[], inProgress:true,
  };
}

/* Overrides a session's chart with a hand-authored "not so happy path": current
   climbs and holds above the WPS max, so the average — not just a stray point —
   reads out of tolerance, while voltage only spikes briefly (non-critical). */
function makeOutOfToleranceSession(s){
  s.chart = [
    {wfs:0.47, current:248, voltage:26.6, power:6.6},
    {wfs:0.48, current:262, voltage:27.4, power:7.2},
    {wfs:0.50, current:278, voltage:29.6, power:8.3},
    {wfs:0.49, current:285, voltage:27.1, power:8.0},
    {wfs:0.46, current:271, voltage:26.3, power:7.3},
  ];
  s.current = Math.round(chartAvg(s.chart,'current'));
  s.voltage = Math.round(chartAvg(s.chart,'voltage')*10)/10;
  s.wfs = Math.round(chartAvg(s.chart,'wfs')*100)/100;
  s.power = Math.round(chartAvg(s.chart,'power')*10)/10;
  s.events = [{time:'00:02', timestamp:'4:41:05 AM Aug 25, 2026', category:'Process alarm', message:'Current exceeded WPS upper limit'}];
  return s;
}

/* One point spikes past the WPS band but the pass average stays inside it — an amber,
   not a red: worth a glance, not a re-test. */
function makeAmberSession(s){
  s.chart = [
    {wfs:0.48, current:238, voltage:26.0, power:6.4},
    {wfs:0.50, current:266, voltage:29.4, power:7.9},
    {wfs:0.47, current:236, voltage:25.8, power:6.3},
    {wfs:0.49, current:240, voltage:26.2, power:6.5},
    {wfs:0.48, current:239, voltage:26.0, power:6.4},
  ];
  s.current = Math.round(chartAvg(s.chart,'current'));
  s.voltage = Math.round(chartAvg(s.chart,'voltage')*10)/10;
  s.wfs = Math.round(chartAvg(s.chart,'wfs')*100)/100;
  s.power = Math.round(chartAvg(s.chart,'power')*10)/10;
  s.events = [{time:'00:01', timestamp:'4:39:10 AM Aug 25, 2026', category:'Process alarm', message:'Current briefly exceeded WPS upper limit'}];
  return s;
}

/* traffic-light convention, matching Assembly's:
   red = average outside WPS limit · amber = some values outside WPS limit ·
   green = all values inside WPS limit · grey = tack weld · teal = weld being performed */
function sessionTrafficLight(s){
  if(s.tack) return 'grey';
  if(s.inProgress) return 'teal';
  const statuses = Object.keys(METRIC_RANGES).map(k=>rangeStatus(s.chart,k));
  if(statuses.some(st=>st.avgBreach)) return 'red';
  if(statuses.some(st=>st.hasPointBreach)) return 'amber';
  return 'green';
}
const TRAFFIC_LIGHT_COLOR = {red:'var(--error)', amber:'var(--warning)', green:'var(--success)', grey:'var(--text-dim)', teal:'#0d9488'};
const TRAFFIC_LIGHT_LABEL = {red:'Average value outside of WPS limit', amber:'Some values outside of WPS limit', green:'All values inside WPS limit', grey:'Tack weld', teal:'Weld being performed'};

function formatArcTime(sec){
  if(sec<60) return sec+' s';
  return Math.floor(sec/60)+'m '+String(sec%60).padStart(2,'0')+'s';
}

<script>
/* ============================= STATE ============================= */
let DATA = seedData();
let state = {
  theme:'system', // 'dark' | 'light' | 'system'
  offline:false,
  queued:0,
  stack:[{screen:'home', params:{}}],
  modal:null,        // {type, ...}
  keypad:null,       // {title, unit, value, onCommit}
  toasts:[],
  draft:null,              // imperfection wizard draft, opened from a weld row's "Add imperfection"
  checklistDraft:null,
  addWeldsSelection:null,       // Set of weldIds ticked on the report "add welds" screen

  currentAssemblyId:Object.keys(ASSEMBLIES)[0], // which assembly the rail's "Assembly" tab and breadcrumbs point to
  partSelection:null,      // {partId, ids:Set} welds ticked on the part weld list, feeds "Add to report"
  pendingReportScope:null, // {assemblyId, partId, weldIds} captured while the "add to report" sheet is open
  reportsFilter:{tab:'drafts', method:'all', assemblyId:'all', search:''}, // "NDT reports" screen
  assembliesFilter:{search:'', onlyWithInspections:false}, // the Assemblies page (change 10)
  pendingInspectionScope:null, // {weldId} captured while "Create inspection" test-type modal is open
  weldSessionFilters:{quality:'all', wpsParam:'all', excludeTack:false}, // weld detail sessions card
};

function findPart(id){ return DATA.parts.find(p=>p.id===id); }
function findWeld(weldId){
  for(const p of DATA.parts){ const w=p.welds.find(w=>w.id===weldId); if(w) return {part:p, weld:w}; }
  return null;
}
function findMachine(id){ return MACHINES.find(m=>m.id===id); }
function findSession(weldId, sessionId){
  const found = findWeld(weldId);
  if(!found) return null;
  const s = (found.weld.sessions||[]).find(s=>s.id===sessionId);
  return s ? {part:found.part, weld:found.weld, session:s} : null;
}

function cur(){ return state.stack[state.stack.length-1]; }

/* keeps state.currentAssemblyId pointed at whichever assembly the screen currently on
   top of the stack belongs to, so the rail's Assembly tab and breadcrumbs stay correct
   without every onclick having to thread an assemblyId through */
function deriveAssemblyId(params){
  if(params.assemblyId) return params.assemblyId;
  if(params.partId){ const p = findPart(params.partId); if(p) return p.assemblyId; }
  if(params.weldId){ const f = findWeld(params.weldId); if(f) return f.part.assemblyId; }
  if(params.reportId){ const r = DATA.reports[params.reportId]; if(r) return r.assemblyId; }
  return null;
}

/* ============================= NAV ============================= */
const App = {
  nav(screen, params={}){
    state.stack.push({screen, params});
    render();
  },
  back(){
    if(state.stack.length>1) state.stack.pop();
    render();
  },
  gotoPart(partId){
    const part = findPart(partId);
    state.stack = [{screen:'home', params:{}}, {screen:'assembly', params:{assemblyId:part.assemblyId}}, {screen:'part', params:{partId}}];
    render();
  },
  home(){
    state.stack = [{screen:'home', params:{}}];
    render();
  },
  toggleTheme(){
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme')==='dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    render();
  },
};

  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return 'Today '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function toast(msg){
  const id = Math.random().toString(36).slice(2);
  state.toasts.push({id,msg});
  renderToasts();
  setTimeout(()=>{ state.toasts = state.toasts.filter(t=>t.id!==id); renderToasts(); }, 3200);
}
function renderToasts(){
  const host = document.getElementById('toastHost');
  if(!host) return;
  host.innerHTML = state.toasts.map(t=>'<div class="toast">'+esc(t.msg)+'</div>').join('');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= RENDER SHELL ============================= */

function render(){
  const {screen, params} = cur();

  const root = document.getElementById('screen');

  const prevContent = document.getElementById('content');

  const prevScroll = preserveScroll ? prevContent.scrollTop : 0;
  const railHtml = RAIL_ITEMS.map(r=>{
    const active = screen===r.screen;
    const onclick = r.screen==='home' ? 'App.home()'
      : r.screen==='assembly' ? "App.nav('assembly',{assemblyId:'"+state.currentAssemblyId+"'})"
      : "App.nav('"+r.screen+"')";
    return '<button class="rail-btn'+(active?' active':'')+'" onclick="'+onclick+'">'+ICON[r.icon]+'<span>'+r.label+'</span></button>';
  }).join('');

  const sc = SCREENS[screen] || SCREENS.home;
  const topbar = sc.topbar(params);
  const body = sc.render(params);
  const footer = sc.footer ? sc.footer(params) : '';

  root.innerHTML =

      '<div class="rail">'+railHtml+'</div>'+

          (state.offline && state.queued>0 ? '<div class="banner banner-warning">'+ICON.wifiOff.replace('<svg','<svg style="width:18px;height:18px;flex:0 0 auto;"')+'<span>'+state.queued+' inspection'+(state.queued===1?'':'s')+' queued — will sync when connected</span></div>' : '')+

  }

}

function facilitatorToggle(){

/* generic modal renderer: state.modal = {title, body(html), actions(html)} built by callers via html strings */
function renderModal(){

const Modal = {

};

function renderKeypad(){
  const k = state.keypad;
  const disp = k.value===''? '<span class="empty-txt" style="color:var(--text-muted)">Enter value</span>' : esc(k.value);
  return '<div class="overlay keypad-overlay" onclick="if(event.target===this) Keypad.cancel()">'+
    '<div class="keypad-sheet">'+
      '<div class="label-sm">'+esc(k.title)+'</div>'+

      '<div class="keys">'+
        [1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" onclick="Keypad.press(\''+n+'\')">'+n+'</button>').join('')+
        '<button class="key" onclick="Keypad.press(\'.\')">.</button>'+
        '<button class="key" onclick="Keypad.press(\'0\')">0</button>'+
        '<button class="key" onclick="Keypad.press(\'back\')">⌫</button>'+
      '</div>'+

    '</div>'+

}
const Keypad = {
  open(title, value, unit, onCommit){
    state.keypad = {title, value: value==null?'':String(value), unit, onCommit};
    render();
  },
  press(k){
    const kp = state.keypad; if(!kp) return;
    if(k==='back') kp.value = kp.value.slice(0,-1);
    else if(k==='.'){ if(!kp.value.includes('.')) kp.value += '.'; }
    else kp.value += k;
    render();
  },
  commit(){
    const kp = state.keypad; if(!kp) return;
    const v = kp.value==='' ? null : parseFloat(kp.value);
    kp.onCommit(v);
    state.keypad = null;
    render();
  },
  cancel(){ state.keypad = null; render(); },
};

/* ============================= SHARED HELPERS ============================= */
function weldStatusBadge(w){
  const map = {
    'Pending': ['badge-muted','Ready for inspection'],
    'Acceptable': ['badge-success','Acceptable'],
    'Not acceptable': ['badge-error','Not acceptable'],
    'Repair — re-test': ['badge-warning','Repair — re-test'],
  };
  const [cls,label] = map[w.status] || ['badge-muted', w.status];
  return '<span class="badge '+cls+'">'+label+'</span>';
}
function weldProgressBadge(w){
  const map = {'Welded':['badge-muted','Welded'],'Welding':['badge-warning','Welding'],'Waiting':['badge-muted','Waiting']};
  const [cls,label] = map[w.weldStatus] || ['badge-muted', w.weldStatus];
  return '<span class="badge '+cls+'">'+label+'</span>';
}
function partSummary(part){
  if(part.blocked){
    const welder = assemblyFor(part).welder;
    const done = part.welds.filter(w=>w.weldStatus==='Welded').length;
    return {blocked:true, text: done+' of '+part.welds.length+' welds complete — waiting on '+welder.name+' ('+welder.stamp+')'};
  }
  const total = part.welds.length;
  const acceptable = part.welds.filter(w=>w.status==='Acceptable').length;
  const repair = part.welds.filter(w=>w.status==='Not acceptable').length;
  const retest = part.welds.filter(w=>w.status==='Repair — re-test').length;
  const pending = part.welds.filter(w=>w.status==='Pending').length;
  const complete = acceptable===total;
  const parts_ = [];
  if(complete) parts_.push('All '+total+' welds acceptable');
  else {
    if(acceptable) parts_.push(acceptable+' acceptable');
    if(pending) parts_.push(pending+' ready for inspection');
    if(retest) parts_.push(retest+' repair — re-test');
    if(repair) parts_.push(repair+' returned for repair');
  }
  return {blocked:false, complete, repair, text: parts_.join(' · ')};
}
function stageCounts(welds){
  const counts = {};
  STAGES.forEach(s=>counts[s]=0);
  welds.forEach(w=>{ const s = w.stage || 'Waiting'; counts[s]=(counts[s]||0)+1; });
  return counts;
}
function stageBar(welds){
  const counts = stageCounts(welds);
  const total = welds.length || 1;
  const segs = STAGES.filter(s=>counts[s]>0).map(s=>
    '<div class="stage-seg" style="flex:'+counts[s]+' 0 0;background:'+STAGE_COLOR[s]+'" title="'+s+': '+counts[s]+'"></div>'
  ).join('');
  const legend = STAGES.filter(s=>counts[s]>0).map(s=>
    '<div class="item"><span class="sw" style="background:'+STAGE_COLOR[s]+'"></span>'+s+' · '+counts[s]+'</div>'
  ).join('');
  return '<div class="stage-track">'+segs+'</div><div class="stage-legend">'+legend+'</div>';
}
/* ---- reports: no more active-report pills in the topbar (change 9) — a weld row always
   knows its own report from the screen it's rendered on, so nothing needs to be resolved ---- */
function draftReportsList(){ return Object.values(DATA.reports).filter(r=>r.status==='draft'); }
function addWeldToReport(reportId, weldId){
  const report = DATA.reports[reportId];
  const found = findWeld(weldId);
  if(!report || !found) return;
  const {weld:w, part} = found;
  if(report.assemblyId!==part.assemblyId) return; // a report never spans two assemblies
  const insp = w.inspections.find(i=>i.method===report.method);
  if(!insp || insp.reportId) return;
  insp.reportId = reportId;
  if(report.welds.indexOf(weldId)===-1) report.welds.push(weldId);
}

/* ---- "Weld N of M · P-01", and jumping straight to the next weld on the part ---- */
function weldPositionText(part, weldId){
  const idx = part.welds.findIndex(w=>w.id===weldId);
  return 'Weld '+(idx+1)+' of '+part.welds.length+' · '+part.id;
}
function nextWeldId(part, weldId){
  const idx = part.welds.findIndex(w=>w.id===weldId);
  if(idx===-1 || idx===part.welds.length-1) return null;
  return part.welds[idx+1].id;
}

    '<path d="M0 120 C 60 108, 100 132, 160 118 S 260 104, 320 122 S 380 130 400 118" stroke="#c99a44" stroke-width="16" fill="none" stroke-dasharray="3 7" stroke-linecap="round" opacity=".5"/>'+
    '<ellipse cx="150" cy="120" rx="2.5" ry="2" fill="#2a2a2a" opacity=".7"/>'+

  const markerHtml = (markers||[]).map(m=>

<script>
/* ============================= SCREENS: home / assembly / part ============================= */
const SCREENS = {};

SCREENS.home = {
  topbar(){
    return topbarBase({title:'WeldCloud Inspect', sub:ASSEMBLIES[state.currentAssemblyId].site, showBack:false, variant:'neutral'});
  },
  render(){
    const groups = Object.values(ASSEMBLIES).map(asm=>{
      const parts = DATA.parts.filter(p=>p.assemblyId===asm.id && p.assigned);
      return assemblyGroupHtml(asm, parts);
    }).join('');
    return '<div class="stack">'+
      '<div class="section-title">Find work yourself</div>'+
      '<div class="grid2">'+

          '<span class="chevron">'+ICON.chevron+'</span>'+
        '</div>'+
        '<div class="card tap" style="display:flex;align-items:center;gap:16px;background:var(--surface-card);" onclick="App.nav(\'assemblies\')">'+
          '<div style="width:52px;height:52px;border-radius:14px;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;color:var(--accent-text);flex:0 0 auto;">'+ICON.doc.replace('<svg','<svg style="width:24px;height:24px;"')+'</div>'+
          '<div style="flex:1;"><div style="font-weight:700;font-size:16px;">Assemblies</div><div class="muted" style="font-size:13px;">Every assembly, part and weld at your sites</div></div>'+

};
/* when every open part in the group already has a prepared report (or is already done),
   there's nothing left for "New report" to do here — so it steps back visually rather
   than competing with the parts that actually need the inspector's attention */
function assemblyAllPartsPrepared(parts){
  const eligible = parts.filter(p=>!p.blocked);
  if(!eligible.length) return false;
  return eligible.every(p=>partSummary(p).complete || !!findPreparedReportForPart(p));
}
function assemblyGroupHtml(asm, parts){
  const allPrepared = assemblyAllPartsPrepared(parts);
  return '<div style="margin-top:8px;">'+
    '<div class="hstack" style="justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;">'+
      '<div><div class="section-title" style="margin-bottom:2px;">'+esc(asm.name)+'</div><div class="muted" style="font-size:13px;">'+asm.id+' · '+esc(asm.client)+'</div></div>'+
      '<button class="btn btn-outline" onclick="App.nav(\'qrScan\',{mode:\'traceability\',assemblyId:\''+asm.id+'\'})">'+ICON.qr.replace('<svg','<svg style="width:16px;height:16px;"')+' Scan to confirm</button>'+
    '</div>'+
    (allPrepared ? '<div class="muted" style="font-size:13px;margin-top:6px;">Reports already prepared by engineering — just work through the welds.</div>' : '')+
    '<div class="grid2" style="margin-top:10px;">'+
      (parts.length ? parts.map(part=>partCardHtml(part, partSummary(part))).join('') : '<div class="muted" style="padding:8px 2px;">No parts assigned to you yet on this assembly.</div>')+
    '</div>'+
  '</div>';
}
/* a part with a still-draft report already scoped to it means engineering prepared the
   report ahead of time — the inspector's path is straight into that report, not the part screen */
function findPreparedReportForPart(part){
  return Object.values(DATA.reports).find(r=>r.status==='draft' && r.scopePartId===part.id) || null;
}
/* every report that carries at least one inspection from this part — a part's welds can land
   on more than one report (different methods, or a report shared with another part) */
function reportsForPart(part){
  const ids = [];
  part.welds.forEach(w=>(w.inspections||[]).forEach(i=>{ if(i.reportId && ids.indexOf(i.reportId)===-1) ids.push(i.reportId); }));
  return ids.map(id=>DATA.reports[id]).filter(Boolean);
}
/* "4 of 6 inspections recorded" — every inspection on every weld on the part, whether or not
   it's on a report yet, counted against how many already carry a result */
function partInspectionProgress(part){
  let total=0, recorded=0;
  part.welds.forEach(w=>(w.inspections||[]).forEach(i=>{ total++; if(i.result!=null) recorded++; }));
  return {total, recorded};
}
function partCardHtml(part, sum){
  const disabledNote = part.blocked ? '<div class="muted" style="font-size:13px;margin-top:8px;">Open to view — inspection unavailable until welding is complete.</div>' : '';
  const reports = part.blocked ? [] : reportsForPart(part);
  const onclick = (reports.length===1) ? "ReportFlow.openReport('"+reports[0].id+"')" : "App.nav('part',{partId:'"+part.id+"'})";
  const statusBadge = part.blocked ? '<span class="badge badge-muted">Blocked</span>'
    : sum.complete ? '<span class="badge badge-success">Done</span>'
    : '<span class="badge badge-info">In progress</span>';
  const prog = partInspectionProgress(part);
  const pct = prog.total ? Math.round(prog.recorded/prog.total*100) : 0;
  const progressHtml = (!part.blocked && prog.total) ? '<div style="margin-top:10px;">'+
      '<div class="hstack" style="justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px;">'+
        '<span>'+prog.recorded+' of '+prog.total+' inspections recorded</span><span>'+pct+'%</span>'+
      '</div>'+
      '<div style="height:8px;border-radius:4px;background:var(--surface-sunken);overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:var(--success);"></div></div>'+
    '</div>' : '';
  // resuming a started draft is the whole point of this chip row — a part with an unfinished
  // draft reads as clearly resumable, not just "in progress"
  const reportChips = reports.length ? '<div class="hstack" style="gap:6px;flex-wrap:wrap;margin-top:10px;">'+
      reports.map(r=>'<span class="chip" style="cursor:pointer;'+(r.status==='draft'?'border-color:var(--accent-text);color:var(--accent-text);':'')+'" onclick="event.stopPropagation();ReportFlow.openReport(\''+r.id+'\')">'+r.method+' · '+r.id+' · '+r.status+'</span>').join('')+
    '</div>' : '';
  return '<div class="card tap" onclick="'+onclick+'">'+
    '<div class="hstack" style="justify-content:space-between;">'+
      '<div style="font-weight:700;font-size:17px;">'+part.id+' · '+part.name+'</div>'+
      statusBadge+
    '</div>'+
    '<div class="muted" style="font-size:14px;margin-top:6px;">'+part.welds.length+' welds</div>'+
    progressHtml+
    reportChips+
    (sum.repair ? '<div class="badge badge-warning" style="margin-top:10px;">'+sum.repair+' returned for repair — part cannot complete</div>' : '')+
    disabledNote+
  '</div>';
}

SCREENS.assembly = {

          '<div><div class="label-sm">Welder</div><div class="val-lg">'+esc(asm.welder.name)+' · '+asm.welder.stamp+'</div><div class="muted" style="font-size:13px;">Qualified to '+asm.welder.validTo+'</div></div>'+

            '<div class="muted">'+part.welds.length+' welds</div>'+
          '</div>'+
          '<div style="margin-top:12px;">'+stageBar(part.welds)+'</div>'+
        '</div>';
      }).join('')+
    '</div>';
  },
